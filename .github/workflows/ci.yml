name: contrato

# El mismo contrato que corre en local. Si build.py falla aquí, el registro que
# lo rompió no entra: la regla de oro no admite excepciones por prisa.
#
# medsemiotics-db se clona y se valida contra la revisión FIJADA en
# dependencias.yaml, con --exigir-indice: en CI, no poder comprobar que cada
# `condicion: HM:` existe es error, no aviso.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Traer medsemiotics-db en la revisión fijada
        run: |
          ref=$(python -c "import yaml; print(yaml.safe_load(open('dependencias.yaml'))['medsemiotics-db']['ref'])")
          git clone --filter=blob:none https://github.com/alcyedmundo281/medsemiotics-db ../medsemiotics-db
          git -C ../medsemiotics-db cat-file -e "$ref^{commit}"

      - name: Validar los registros
        run: python scripts/build.py --exigir-indice

      - name: Pruebas del contrato
        run: python -m unittest discover -s tests -v
