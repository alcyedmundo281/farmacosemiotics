name: contrato

# El mismo contrato que corre en local. Si build.py falla aquí, el registro que
# lo rompió no entra: la regla de oro no admite excepciones por prisa.
on:
  push:
    branches: [main]
    paths:
      - 'farmacos/**'
      - 'fichas/**'
      - 'referencias/**'
      - 'catalogo/**'
      - 'costos/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar los registros
        run: python scripts/build.py

      - name: Generar índice, reto, sitio y la proyección del libro
        run: |
          python scripts/indice.py
          python scripts/reto.py
          python scripts/sitio.py
          python scripts/qmd.py

      - name: Pruebas del contrato
        run: python -m unittest discover -s tests -v

      - name: Cobertura frente a la Lista Modelo de la OMS
        run: python scripts/eml.py

      - name: Guardar las salidas
        uses: actions/upload-artifact@v4
        with:
          name: salidas
          path: |
            build/index.json
            build/reto.json
            build/jsonld/
            build/jats/
            build/quarto/
          retention-days: 30

  # El libro va en su propio job porque necesita Quarto, que no es una
  # dependencia del repositorio. Si la encuadernación falla, el contrato de
  # arriba sigue siendo verde: son dos cosas distintas y conviene poder
  # distinguirlas de un vistazo.
  libro:
    runs-on: ubuntu-latest
    needs: validar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Encuadernar el EPUB con todas las guías
        run: python scripts/epub.py

      - uses: actions/upload-artifact@v4
        with:
          name: libro
          path: build/guias-farmacoterapeuticas.epub
          retention-days: 30
