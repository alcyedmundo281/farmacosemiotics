# Catálogo: Lista Modelo de Medicamentos Esenciales de la OMS.
#
# Es la META DE CONTENIDO del repositorio, no un registro clínico. Dice QUÉ
# hay que cubrir; `scripts/eml.py` compara esta meta contra farmacos/ y
# fichas/ y reporta el hueco.
#
# Las 30 secciones de primer nivel están verificadas una a una contra el anexo
# del informe oficial. Las subsecciones se extrajeron del mismo PDF y llevan el
# título en inglés TAL CUAL aparece en la fuente: no se traducen, porque el
# título de sección es la clave con la que se cita la LME.
#
# `completo: false` no es un descuido: el anexo viene maquetado a dos columnas
# y unas pocas subsecciones no sobrevivieron la extracción. Se completan a mano
# contra la fuente, oleada por oleada, nunca de memoria.

