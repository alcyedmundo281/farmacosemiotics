# ── Farmacología ────────────────────────────────────────────────────────
mecanismo: >-
  Profármaco de la mercaptopurina, con la que comparte por completo su
  interacción con las dos enzimas que deciden su toxicidad. La TPMT cataboliza
  la mercaptopurina a metilmercaptopurina inactiva, de modo que queda menos
  fármaco disponible para anabolizarse a nucleótidos de tioguanina, que son los
  metabolitos activos. La NUDT15, por su parte, convierte el trifosfato de
  tioguanina citotóxico en monofosfato no tóxico. Quien tiene poca actividad de
  cualquiera de las dos acumula metabolito activo con la dosis habitual, y ahí
  es donde aparece la mielosupresión.
mecanismo_en: >-
  Azathioprine is a prodrug for mercaptopurine; TPMT catabolizes mercaptopurine
  to inactive methylmercaptopurine, and NUDT15 converts cytotoxic thioguanine
  triphosphate to non-toxic thioguanine monophosphate.
mecanismo_ref: 'pmid:30447069'

farmacocinetica:
  activacion: >-
    Requiere conversión a mercaptopurina y anabolismo posterior a nucleótidos
    de tioguanina. Por eso el efecto no es inmediato y la dosis no se juzga por
    la respuesta de la primera semana.
  estado_estacionario: >-
    Se alcanza en dos a cuatro semanas, que es el plazo por debajo del cual un
    escalado de dosis todavía no puede leerse.
  ref: 'pmid:30447069'

formas:
  - forma: comprimido
    concentraciones: ['25 mg', '50 mg']
    via: oral

# ── Seguridad ───────────────────────────────────────────────────────────
seguridad:
  reacciones:
    - evento: Mielosupresión
      gravedad: mortal
      nota: >-
        Es el daño que ordena todo lo demás. Quien hereda dos alelos sin
        función de TPMT tiene riesgo muy alto de mielosupresión potencialmente
        mortal si recibe dosis convencionales. Entre los heterocigotos, solo un
        30-60 % no tolera la dosis plena, y esa es justamente la razón de que
        el heterocigoto se ajuste en vez de excluirse.
      ref: 'pmid:30447069'

    - evento: Hepatotoxicidad
      gravedad: moderada
      nota: >-
        Se atribuye a los nucleótidos de metilmercaptopurina, que tienen
        actividad propia. No depende de una actividad baja de TPMT, así que un
        genotipo normal no la descarta.
      ref: 'pmid:30447069'

    - evento: Pancreatitis
      gravedad: grave
      nota: >-
        Tampoco guarda relación con la actividad baja de TPMT. Genotipar no
        sustituye a vigilarla.
      ref: 'pmid:30447069'

    - evento: Neoplasias secundarias
      gravedad: grave
      nota: >-
        Se han asociado a actividad deficiente de TPMT sin que mediara
        necesariamente una mielosupresión aguda grave. Si limitar la dosis en
        el paciente con defecto de TPMT reduce ese riesgo tardío, no se sabe:
        la fuente lo deja explícitamente abierto.
      ref: 'pmid:30447069'

