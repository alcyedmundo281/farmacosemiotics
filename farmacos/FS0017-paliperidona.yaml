  - Palmitato de paliperidona

atc: N05AX13
clase_farmacologica: Antipsicótico atípico (antagonista dopaminérgico D2 y serotoninérgico 5-HT2A) de acción prolongada
clase_farmacologica_en: Atypical antipsychotic, long-acting injectable

estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
