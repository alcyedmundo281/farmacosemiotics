clase_farmacologica: Inhibidor selectivo de segunda generación de la tirosina quinasa de Bruton (BTK)
clase_farmacologica_en: Second-generation Bruton's tyrosine kinase (BTK) inhibitor

estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
idioma: es
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
