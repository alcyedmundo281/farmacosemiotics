mecanismo: Inhibe de forma competitiva y reversible la enzima HMG-CoA reductasa, paso
  limitante en la biosíntesis intracelular de colesterol en el hepatocito. La disminución
  del colesterol intracelular induce una sobreexpresión compensatoria de receptores
  de LDL en la membrana hepática, aumentando la depuración plasmática de partículas
  aterogénicas (LDL, VLDL, apolipoproteína B) y reduciendo las concentraciones de
  triglicéridos séricos.
mecanismo_ref: pmid:15755765
farmacocinetica:
  eliminacion: Metabolismo hepático extenso mediado principalmente por CYP3A4 formando
    metabolitos orto y parahidroxilados activos; eliminación biliar/fecal (> 98 %),
    excreción renal mínima (< 2 %)
  vida_media: '14 horas (actividad inhibitoria efectiva de metabolitos: 20 a 30 horas)'
  implicacion: No requiere ajuste de dosis en insuficiencia renal; susceptible a interacciones
    mayores con inhibidores potentes de CYP3A4 que eleven su concentración plasmática
    y aumenten el riesgo de miopatía.
