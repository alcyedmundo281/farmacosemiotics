mecanismo: Acetila de manera irreversible el residuo de serina-529 en el sitio catalítico
  de la ciclooxigenasa-1 (COX-1) plaquetaria, bloqueando de forma permanente la síntesis
  de tromboxano A2 (TXA2, potente agonista plaquetario y vasoconstrictor) durante
  toda la vida media de la plaqueta circulante (7 a 10 días).
mecanismo_ref: pmid:19482214
farmacocinetica:
  eliminacion: Rápida hidrólisis sistémica y hepática a ácido salicílico por esterasas
    séricas y tisulares; posterior conjugación hepática a ácido salicilúrico y excreción
    renal dependiente del pH urinario
  vida_media: 15 a 20 minutos para el AAS; 2 a 3 horas para el salicilato a dosis
    bajas (75-100 mg)
  implicacion: La inhibición plaquetaria es permanente y persiste días tras la suspensión;
    a dosis de 75 a 100 mg diarios preserva la producción endotelial de prostaciclina
    (PGI2) vasodilatadora mediada por COX-2.
