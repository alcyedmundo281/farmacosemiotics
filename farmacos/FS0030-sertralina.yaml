mecanismo: Inhibe de forma potente y altamente selectiva el transportador presináptico
  de serotonina (SERT), bloqueando la recaptación de 5-hidroxitriptamina en la hendidura
  sináptica y potenciando la neurotransmisión serotoninérgica en el sistema nervioso
  central. Presenta una inhibición débil complementaria del transportador de dopamina
  (DAT), con mínima afinidad por receptores muscarínicos, colinérgicos o histaminérgicos.
mecanismo_ref: pmid:29477251
farmacocinetica:
  eliminacion: Metabolismo hepático extenso vía desmetilación mediada por CYP2B6,
    CYP2C19, CYP3A4 y CYP2D6 a N-desmetilsertralina (metabolito sustancialmente menos
    activo); excreción equilibrada en orina (45 %) y heces (45 %)
  vida_media: 26 horas (62 a 104 horas para N-desmetilsertralina)
  implicacion: Permite posología en dosis única diaria (mañana o noche); bajo potencial
    de inhibición enzimática de CYP2D6 frente a fluoxetina o paroxetina, con menor
    tasa de interacciones clínicamente relevantes.
