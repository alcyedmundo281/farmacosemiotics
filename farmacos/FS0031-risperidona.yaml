mecanismo: Antagonista monoaminérgico selectivo con alta afinidad por receptores serotoninérgicos
  5-HT2A y dopaminérgicos D2. Su potente antagonismo central 5-HT2A modula la liberación
  dopaminérgica en la corteza prefrontal y la vía nigroestriada, reduciendo la incidencia
  de efectos extrapiramidales y mejorando los síntomas negativos y afectivos en comparación
  con neurolépticos clásicos, mientras que el bloqueo D2 mesolímbico confiere eficacia
  antipsicótica robusta.
mecanismo_ref: pmid:16172203
farmacocinetica:
  eliminacion: Metabolismo hepático oxidativo mediado predominantemente por CYP2D6
    hacia 9-hidroxirisperidona (paliperidona, metabolito con actividad farmacológica
    equipotente); excreción mayoritariamente renal (70 %) y fecal (14 %)
  vida_media: 3 horas para risperidona en metabolizadores rápidos; 24 horas para la
    fracción antipsicótica activa global (risperidona + 9-OH-risperidona)
  implicacion: Requiere ajuste de dosis en insuficiencia renal y hepática moderada-grave;
    riesgo de elevación dosis-dependiente de prolactina y síntomas extrapiramidales
    a dosis superiores a 6 mg/día.
