mecanismo: Profármaco del ácido micofenólico (MPA). El MPA inhibe de manera no competitiva,
  potente y reversible la isoforma II de la inosina monofosfato deshidrogenasa (IMPDH),
  bloqueando la vía de novo de síntesis de nucleótidos de guanina. Dado que los linfocitos
  T y B proliferantes dependen críticamente de esta vía y carecen de vía de rescate
  eficaz, el micofenolato induce un efecto citostático linfocitario selectivo, suprimiendo
  la síntesis de autoanticuerpos y la inmunidad celular sin mielotoxicidad cruzada
  masiva.
mecanismo_ref: pmid:20410913
farmacocinetica:
  eliminacion: Rápida hidrólisis presistémica a ácido micofenólico activo por esterasas
    plasmáticas; posterior glucuronidación hepática por UGT1A9 a glucurónido fenólico
    de MPA (MPAG, inactivo); eliminación renal del MPAG (93 %) con recirculación enterohepática
    secundaria
  vida_media: 16 a 18 horas
  implicacion: No depende de TPMT/NUDT15 (a diferencia de azatioprina); susceptible
    a reducción de absorción por quelantes orales (hierro, antiácidos con magnesio/aluminio);
    riesgo teratogénico mayor que contraindica su uso sin anticoncepción estricta.
