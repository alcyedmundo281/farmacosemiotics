  secciones_adicionales: ['12.4', '16']
  formulaciones:
    - 'Oral liquid: 50 mg/5 mL'
    - 'Solid oral dosage form: 12.5 mg; 25 mg'
  alternativas_terapeuticas:
    - tipo: medicamento
      dci: Clortalidona
      dci_en: chlorthalidone
    - tipo: medicamento
      dci: Clorotiazida
      dci_en: chlorothiazide
    - tipo: medicamento
      dci: Indapamida
      dci_en: indapamide
  nota_alternativas: >-
    Que la clortalidona figure como alternativa terapéutica de la
    hidroclorotiazida no es un detalle de catálogo: el ensayo que sostiene la
    superioridad de las tiazidas —ALLHAT— usó clortalidona, no
    hidroclorotiazida. Lo que la Lista Modelo declara intercambiable es lo que
    permite leer esa evidencia sobre este fármaco, y lo que obliga a decirlo en
    voz alta.
  fuente: 'who:eml24'
  url: https://www.who.int/publications/i/item/B09474
  consultado: '2026-08-24'

mecanismo: >-
  Inhibe la reabsorción de sodio y cloro en el túbulo contorneado distal. El
  efecto hipotensor sostenido no se explica solo por la depleción de volumen
  inicial: a largo plazo predomina un descenso de las resistencias periféricas.
mecanismo_en: >-
  Inhibits sodium and chloride reabsorption in the distal convoluted tubule;
  the sustained antihypertensive effect involves a fall in peripheral vascular
  resistance beyond the initial volume depletion.
mecanismo_ref: 'fda:label'

formas:
  - forma: comprimido
    concentraciones: ['12,5 mg', '25 mg', '50 mg']
    via: oral
  - forma: solución oral
    concentraciones: ['50 mg/5 mL']
    via: oral

seguridad:
  reacciones:
    - evento: Hipopotasemia
      frecuencia: frecuente
      gravedad: moderada
      nota: >-
        Dependiente de la dosis. Es la razón por la que la Lista Modelo lista
        12,5 y 25 mg: por encima de esas dosis crece el daño metabólico sin
        ganancia proporcional de descenso tensional.
      ref: 'fda:label'
    - evento: Hiponatremia
      frecuencia: frecuente
      gravedad: grave
      nota: Más frecuente y más peligrosa en personas mayores.
      ref: 'fda:label'
    - evento: Hiperuricemia y precipitación de gota
      frecuencia: frecuente
      gravedad: moderada
      ref: 'fda:label'
    - evento: Hiperglucemia y alteración del perfil lipídico
      frecuencia: frecuente
      gravedad: leve
      ref: 'fda:label'

  contraindicaciones:
    - motivo: Anuria
      ref: 'fda:label'
    - motivo: >-
        Hipersensibilidad a la hidroclorotiazida o a otros fármacos derivados de
        sulfonamida
      ref: 'fda:label'

