mecanismo: >-
  El losartán y su metabolito activo principal bloquean el receptor de la
  angiotensina II, la hormona vasoactiva primaria del sistema renina-angiotensina
  y estímulo de la secreción de aldosterona. A diferencia de los IECA no
  interfiere con la degradación de bradicinina, lo que explica que no produzca la
  tos característica de aquéllos.
mecanismo_en: >-
  Losartan and its principal active metabolite block the angiotensin II
  receptor; angiotensin II is the primary vasoactive hormone of the
  renin-angiotensin system and also stimulates aldosterone secretion.
mecanismo_ref: 'fda:label'

farmacocinetica:
  metabolito_activo: >-
    Buena parte del efecto la aporta el metabolito carboxílico E-3174, más
    potente y de vida media más larga que el propio losartán.
  ref: 'fda:label'

formas:
  - forma: comprimido
    concentraciones: ['25 mg', '50 mg', '100 mg']
    via: oral

seguridad:
  reacciones:
    - evento: Hiperpotasemia
      frecuencia: frecuente
      gravedad: moderada
      ref: 'fda:label'
    - evento: Deterioro de la función renal
      frecuencia: frecuente
      gravedad: moderada
      nota: >-
        Sobre todo en estenosis bilateral de la arteria renal o en situaciones de
        depleción de volumen.
      ref: 'fda:label'
    - evento: Angioedema
      frecuencia: rara
      gravedad: grave
      nota: >-
        Menos frecuente que con los IECA, pero descrito. No es un fármaco seguro
        por definición en quien lo tuvo con un IECA.
      ref: 'fda:label'

  contraindicaciones:
    - motivo: Hipersensibilidad a cualquier componente del producto
      ref: 'fda:label'
    - motivo: Uso conjunto con aliskiren en pacientes con diabetes
      ref: 'fda:label'

alertas:
  - agencia: FDA
    tipo: recuadro
    asunto: >-
      Toxicidad fetal. Los fármacos que actúan directamente sobre el sistema
      renina-angiotensina pueden causar daño y muerte al feto. Cuando se detecta
      un embarazo, el losartán se suspende cuanto antes.
    url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=1843ee4b-1afc-4992-993a-4b0e03e785fc
    fuente: 'openfda:label'
    consultado: '2026-08-24'
    implicacion: >-
      La misma advertencia que lleva el enalapril, y por la misma razón de
      mecanismo. Cambiar de un IECA a un ARA II por la tos no elimina este
      riesgo.

