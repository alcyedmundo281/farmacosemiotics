mecanismo: >-
  Análogo estructural del fosfoenolpiruvato que inhibe de forma irreversible la
  MurA (UDP-N-acetilglucosamina enolpiruvil transferasa), la enzima que cataliza el primer paso
  citoplasmático de la síntesis de peptidoglicano. Al bloquear un paso anterior al que atacan los
  betalactámicos, no comparte diana con ellos y conserva actividad frente a cepas productoras de
  betalactamasas de espectro extendido. La sal de trometamol existe por una razón
  farmacocinética y no química: eleva la biodisponibilidad oral lo suficiente para que una sola
  dosis de 3 g mantenga concentraciones urinarias por encima de la CMI de Escherichia coli
  durante dos o tres días, que es el fundamento entero de la pauta monodosis.
mecanismo_ref: 'fda:label'

farmacocinetica:
  eliminacion: >-
    Excreción renal del fármaco inalterado por filtración glomerular, sin metabolismo previo;
    la concentración urinaria se mantiene elevada durante 24 a 48 horas tras la dosis única
  vida_media: 'Aproximadamente 4 a 8 horas en plasma, con persistencia urinaria muy superior'
  implicacion: >-
    La pauta de 3 g en dosis única disuelta en agua y tomada con el estómago vacío —preferentemente
    al acostarse y tras vaciar la vejiga— nace de esa persistencia urinaria. La misma dependencia
    de la filtración glomerular hace que la insuficiencia renal avanzada reduzca la concentración
    urinaria alcanzada y comprometa la eficacia.
  ref: 'fda:label'

seguridad:
  reacciones:
    - evento: Diarrea
      frecuencia: frecuente
      gravedad: leve
      nota: >-
        Es la reacción más habitual de la dosis única. En el ensayo cara a cara frente a
        nitrofurantoína apareció en 5 de 247 pacientes (1 %), y las náuseas en 5 de 247 (2 %);
        el perfil global de efectos adversos fue escaso en ambas ramas.
      ref: 'pmid:29710295'

    - evento: Náuseas, dispepsia y dolor abdominal
      frecuencia: frecuente
      gravedad: leve
      nota: >-
        Autolimitadas. La administración con el estómago vacío mejora la absorción pero puede
        acentuar la molestia digestiva.
      ref: 'pmid:29710295'

    - evento: Cefalea y mareo
      frecuencia: frecuente
      gravedad: leve
      nota: Transitorios y sin repercusión clínica en la pauta de dosis única.
      ref: 'fda:label'

    - evento: Vaginitis
      frecuencia: frecuente
      gravedad: leve
      nota: Comunicada en los ensayos de registro; no obliga a cambiar de antibiótico.
      ref: 'fda:label'

    - evento: Reacción de hipersensibilidad, incluida angioedema y anafilaxia
      frecuencia: rara
      gravedad: grave
      nota: Obliga a suspender y contraindica la reexposición.
      ref: 'fda:label'

    - evento: Colitis asociada a Clostridioides difficile
      frecuencia: rara
      gravedad: grave
      nota: >-
        Riesgo compartido por todos los antibacterianos y menor con una dosis única que con
        ciclos prolongados; debe considerarse ante diarrea que persiste o empeora tras el tratamiento.
      ref: 'fda:label'

  contraindicaciones:
    - motivo: >-
        Hipersensibilidad conocida a la fosfomicina: riesgo de reacción anafiláctica en la
        reexposición.
      ref: 'fda:label'
    - motivo: >-
        Pielonefritis aguda o absceso perinéfrico: la pauta oral monodosis está estudiada y
        autorizada para la cistitis no complicada, y una infección del tracto urinario superior
        exige un régimen con penetración tisular sostenida.
      ref: 'pmid:21292654'

