mecanismo: >-
  Betalactámico bactericida que acila el sitio activo de las proteínas fijadoras de penicilina
  (PBP), las transpeptidasas que entrecruzan las cadenas de peptidoglicano, y detiene la síntesis
  de la pared en la fase de división. El grupo amino en posición para del anillo fenólico, que es
  lo único que la separa de la ampicilina, le da dos propiedades que deciden su uso ambulatorio:
  es estable en presencia de ácido gástrico y se absorbe por vía oral de forma rápida y mucho más
  completa que la ampicilina, lo que la hace utilizable por boca donde aquella obligaba a la vía
  parenteral; y conserva actividad frente a Streptococcus pneumoniae, incluidas la mayoría de las cepas con resistencia
  intermedia a penicilina, que se superan elevando la dosis en vez de cambiando de familia. Carece
  de actividad frente a los productores de betalactamasas y frente a los patógenos atípicos sin
  pared peptidoglicánica convencional, como Mycoplasma pneumoniae y Legionella.
mecanismo_ref: 'fda:label'

farmacocinetica:
  eliminacion: >-
    Excreción renal del 60-70 % de la dosis como fármaco inalterado por filtración glomerular y
    secreción tubular activa, con metabolismo hepático menor
  vida_media: 'Aproximadamente 1 a 1.5 horas en adultos con función renal normal'
  implicacion: >-
    La vida media corta y el efecto dependiente del tiempo por encima de la CMI son la razón de
    las tres tomas diarias y de que la dosis alta de 1 g cada 8 horas sea lo que vence a la
    resistencia intermedia del neumococo: no se gana subiendo el pico, se gana manteniendo la
    concentración. Con TFGe inferior a 30 mL/min/1.73 m² hay que espaciar el intervalo.
  ref: 'fda:label'

seguridad:
  reacciones:
    - evento: Diarrea, náuseas y exantema cutáneo
      frecuencia: muy_frecuente
      gravedad: leve
      nota: >-
        Es el conjunto que mide el daño atribuible del fármaco: en el ensayo multinacional frente
        a placebo en infección respiratoria baja aguda, náuseas, exantema o diarrea aparecieron
        con un número necesario para dañar de 21 (IC 95 % 11 a 174).
      ref: 'pmid:23265995'

    - evento: Exantema morbiliforme tardío no alérgico
      frecuencia: frecuente
      gravedad: leve
      nota: >-
        Aparece hacia el quinto a séptimo día, es más probable en infección vírica concomitante
        —sobre todo mononucleosis infecciosa— y no es mediado por IgE. Distinguirlo de la alergia
        verdadera importa: etiquetar de alérgico a penicilina a quien no lo es empuja de por vida
        hacia antibióticos de espectro más amplio y peor perfil.
      ref: 'fda:label'

    - evento: Reacción anafiláctica y otras reacciones de hipersensibilidad mediadas por IgE
      frecuencia: rara
      gravedad: letal
      nota: >-
        Puede ser mortal. En el mismo ensayo frente a placebo se registró un caso con amoxicilina
        entre 1038 pacientes tratados. Contraindica la reexposición a cualquier betalactámico sin
        estudio alergológico previo.
      ref: 'pmid:23265995'

    - evento: Colitis asociada a Clostridioides difficile
      frecuencia: infrecuente
      gravedad: grave
      nota: >-
        Puede aparecer hasta dos meses después del tratamiento. Ante diarrea que persiste o
        empeora, suspender y estudiar la toxina.
      ref: 'fda:label'

    - evento: Reacciones cutáneas graves (síndrome de Stevens-Johnson, necrólisis epidérmica tóxica, pustulosis exantemática generalizada aguda)
      frecuencia: rara
      gravedad: grave
      nota: Obligan a suspender de inmediato y contraindican la reexposición de por vida.
      ref: 'fda:label'

    - evento: Hepatitis colestásica e ictericia
      frecuencia: rara
      gravedad: grave
      nota: >-
        Mucho más frecuente con la combinación amoxicilina-clavulánico que con la amoxicilina sola,
        lo que es en sí un argumento para no asociar el inhibidor sin indicación.
      ref: 'fda:label'

    - evento: Nefritis intersticial y cristaluria
      frecuencia: rara
      gravedad: grave
      nota: Favorecidas por la dosis alta y la diuresis escasa; mantener la hidratación.
      ref: 'fda:label'

  contraindicaciones:
    - motivo: >-
        Antecedente de reacción anafiláctica o de reacción cutánea grave (síndrome de
        Stevens-Johnson, necrólisis epidérmica tóxica, pustulosis exantemática generalizada
        aguda) a cualquier betalactámico: riesgo de reacción mortal en la reexposición.
      ref: 'fda:label'
    - motivo: >-
        Antecedente de ictericia o disfunción hepática atribuida a amoxicilina: la reexposición
        reproduce el daño hepático.
      ref: 'fda:label'

