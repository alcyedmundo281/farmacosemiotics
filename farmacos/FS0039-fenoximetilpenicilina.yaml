# Principio activo. Lo que NO depende de la indicación.
#
# Es la penicilina con la que está medida la prevención de la fiebre reumática,
# y de ahí viene su sitio en el repositorio: SEL:0027 la compara como
# alternativa de pleno derecho frente a la amoxicilina de FS:0038, con la
# seguridad a su favor —es el de espectro más estrecho de los cuatro
# candidatos— y la conveniencia en contra.
#
# Advertencia sobre la procedencia de los datos de esta ficha: la etiqueta
# estadounidense de la penicilina V potásica es de formato anterior a la regla
# de etiquetado moderna, y por eso no trae apartados de embarazo, lactancia,
# interacciones ni ajuste renal numérico. No es un olvido de quien escribe esta
# ficha: se comprobaron las 20 etiquetas de `penicillin v potassium` indexadas
# en openFDA el 2026-10-15 y ninguna de ellas los trae. Lo que falta por eso
# queda declarado en los `huecos_declarados` de FA:0039, no rellenado.

