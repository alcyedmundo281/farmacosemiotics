# Principio activo. Lo que NO depende de la indicación.
#
# Entra en el repositorio por SEL:0027, donde es el único de los cuatro
# candidatos con superioridad publicada —y conviene saber en qué: en curación
# bacteriológica, que es un desenlace sustituto— y donde pierde el eje de la
# seguridad por espectro. Pero se escribe pensando en dos indicaciones, no en
# una: la infección de piel y partes blandas es el tema siguiente de la oleada
# 2 y va a necesitar esta misma molécula. De ahí el `alcance` de FA:0040.

