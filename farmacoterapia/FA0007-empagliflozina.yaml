# PARTE II — Farmacoterapia: cómo se usa la empagliflozina con seguridad.
#
# Es el CONCEPTO y va por molécula. El código FA: va 1:1 con su FS: y la ficha
# no lo enlaza, lo deduce.
#
# Hay una particularidad de esta molécula que conviene tener presente al leer lo
# que sigue: el inhibidor de SGLT2 pierde eficacia HIPOGLUCEMIANTE a medida que
# cae el filtrado glomerular, pero CONSERVA el beneficio renal y cardiovascular.
# Esa disociación explica casi todas las reglas de abajo. Explica que se
# recomiende con independencia de la hemoglobina glucosilada y del objetivo
# glucémico alcanzado; explica que se inicie con filtrados en los que ya casi no
# baja la glucosa; y explica que se continúe por debajo del umbral de inicio si
# ya estaba puesto y se tolera. Un fármaco que se juzgara solo por la glucemia se
# retiraría exactamente cuando más protege.
#
# La fuente es el informe de consenso conjunto de la ADA y KDIGO de 2022, el
# mismo que sostiene FA:0001 y FA:0006. Su población es la persona con diabetes
# tipo 2 y enfermedad renal crónica, y eso acota lo que aquí puede afirmarse: la
# empagliflozina tiene además una indicación en insuficiencia cardíaca —la que
# desarrolla FT:0007—, y las guías de insuficiencia cardíaca de la ESC y de la
# AHA/ACC/HFSA, que son las que fijarían el seguimiento en ese escenario, no
# resultaron accesibles en esta sesión. Lo que hay abajo vale como propiedad de
# la molécula; lo que falta está declarado.

id: 'FA:0007'
tipo: farmacoterapia
farmaco: 'FS:0007'

titulo: Farmacoterapia con empagliflozina
titulo_en: Empagliflozin pharmacotherapy

alcance: >-
  Sirve a cualquier indicación de la empagliflozina como inhibidor del
  cotransportador sodio-glucosa tipo 2. Lo que cubre es el umbral de filtrado
  glomerular para iniciarla y la regla —distinta— para continuarla, y las cuatro
  consideraciones de seguridad que la fuente tabula para la clase con su medida
  de mitigación: infección micótica genital, depleción de volumen, cetoacidosis
  diabética e hipoglucemia. Cubre también las combinaciones que obligan a
  ajustar otro fármaco y no este. Lo que NO cubre, y queda declarado abajo, es
  el cronograma: la fuente nombra qué vigilar pero no con qué periodicidad, y
  por eso no hay aquí una tabla de fases. Un lector que busque «cada cuánto»
  no lo encontrará, y es mejor decirlo aquí que dejarlo suponer.

estado: borrador
fecha: '2026-09-05'
actualizado: '2026-09-05'
idioma: es
autores:
