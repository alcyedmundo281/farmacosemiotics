id: FA:0028
tipo: farmacoterapia
farmaco: FS:0028
titulo: Farmacoterapia con atorvastatina
titulo_en: Atorvastatin pharmacotherapy
alcance: 'Establece el protocolo de seguridad y seguimiento clínico para inhibidores
  de la HMG-CoA reductasa (atorvastatina) en prevención cardiovascular primaria y
  secundaria: monitorización basal y periódica del perfil lipídico y transaminasas
  hepáticas (ALT/AST), cribado y manejo de síntomas musculares asociados a estatinas
  (SAMS) y rabdomiólisis, interacciones farmacocinéticas con inhibidores de CYP3A4
  y ajuste en comorbilidades.'
estado: revisado
fecha: '2026-09-16'
actualizado: '2026-09-16'
idioma: es
autores:
- nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0
cribado_basal:
- prueba: Perfil lipídico completo en ayunas (colesterol total, c-LDL, c-HDL, triglicéridos)
  motivo: Calcular la concentración basal de c-LDL para fijar la meta terapéutica
    y cuantificar el porcentaje de reducción alcanzado.
  responsable: seguimiento
  ref: pmid:15755765
- prueba: Transaminasas séricas basales (alanina aminotransferasa ALT / AST)
  motivo: Descartar hepatopatía activa o elevación enzimática no diagnosticada antes
    de iniciar la estatina.
  responsable: seguimiento
  ref: pmid:15755765
- prueba: Creatina quinasa (CK) sérica basal
  motivo: Recomendable en pacientes con alto riesgo de miopatía (edad avanzada, polimedicados,
    antecedentes de dolor muscular) para contar con valor de referencia.
  responsable: seguimiento
  ref: fda:label
monitorizacion:
- fase: basal
  pruebas:
  - Perfil lipídico sérico completo
  - ALT sérica y función renal básica
  - Hemoglobina glicosilada (HbA1c) basal para despistaje de disglucemia
  responsable: seguimiento
  ref: fda:label
- fase: induccion
  periodo: Semanas 4 a 12 tras inicio o escalado de dosis
  frecuencia: Control analítico a las 8-12 semanas
  pruebas:
  - Perfil lipídico completo para constatar respuesta diana (descenso ≥ 50 % en c-LDL
    con 80 mg/día)
  - ALT sérica de control si hay sospecha de hepatotoxicidad
  - Interrogatorio clínico activo sobre dolores musculares o mialgias proximales bilaterales
  responsable: seguimiento
  ref: pmid:15755765
- fase: mantenimiento
  periodo: Tratamiento crónico indefinido
  frecuencia: Anual (o cada 6 meses si no se alcanza objetivo)
  pruebas:
  - Perfil lipídico anual para monitorizar cumplimiento y persistencia terapéutica
  - Reevaluación de medicación concomitante para prevenir interacciones con nuevos
    inhibidores de CYP3A4
  responsable: seguimiento
  ref: fda:label
umbrales_accion:
- parametro: Elevación persistente de ALT > 3 veces el límite superior de la normalidad
    (LSN)
  umbral: Toxicidad hepática Grado 2-3
  accion: Repetir la analítica en 1-2 semanas. Si persiste > 3x LSN, suspender o reducir
    temporalmente la dosis de atorvastatina e investigar otras causas (alcohol, esteatosis,
    fármacos). Al normalizarse, puede reintentarse con dosis menor (10-20 mg) o estatina
    alternativa.
  ref: pmid:15755765
- parametro: Mialgias intensas o astenia muscular con elevación de CK > 5 veces el
    LSN
  umbral: Miositis farmacológica
  accion: Suspender temporalmente atorvastatina. Hidratar al paciente y vigilar función
    renal y coloración de la orina (coluria). Reanudar tras resolución completa a
    menor dosis o en días alternos.
  ref: fda:label
- parametro: Elevación severa de CK > 10 veces el LSN con mialgias o mioglobinuria
  umbral: Sospecha de rabdomiólisis
  accion: Suspensión inmediata y definitiva de la estatina. Derivar a urgencias hospitalarias
    para hidratación intravenosa vigorosa y monitorización del fracaso renal agudo.
  ref: fda:label
- parametro: Mialgias leves a moderadas con niveles normales de CK
  umbral: Síntomas musculares asociados a estatinas (SAMS)
  accion: Pausar el tratamiento durante 2 a 4 semanas (ventana de lavado). Si los
    síntomas ceden, reintroducir atorvastatina a dosis más baja (10-20 mg/día) o asociar
    ezetimiba para mantener la meta de c-LDL.
  ref: fda:label
interacciones:
- con: Inhibidores potentes de CYP3A4 (ej. claritromicina, itraconazol, ketoconazol,
    ritonavir)
  gravedad: mayor
  efecto: Aumento masivo (hasta 4-5 veces) de las concentraciones séricas de atorvastatina
    con riesgo crítico de miopatía severa y rabdomiólisis.
  conducta: Evitar la combinación. Si se precisa pauta corta de claritromicina, suspender
    temporalmente atorvastatina durante los días de tratamiento antibiótico.
  ref: fda:label
- con: Fibratos (especialmente gemfibrozilo)
  gravedad: mayor
  efecto: Inhibición de la glucuronidación de la estatina y competición por captación
    hepática OATP1B1, multiplicando el riesgo de daño muscular.
  conducta: Contraindicada la combinación con gemfibrozilo. Si se requiere asociar
    un fibrato para hipertrigliceridemia grave, fenofibrato presenta un perfil mucho
    más seguro.
  ref: fda:label
- con: Zumo de pomelo (consumo en grandes cantidades > 1 litro/día)
  gravedad: moderada
  efecto: Inhibición del CYP3A4 intestinal que eleva la biodisponibilidad oral de
    atorvastatina.
  conducta: Aconsejar a los pacientes evitar el consumo excesivo de pomelo durante
    el tratamiento.
  ref: fda:label
reproductivo:
  gestacion:
    compatibilidad: contraindicado
    enunciado: El colesterol y sus metabolitos son esenciales para la embriogénesis
      y el desarrollo del sistema nervioso fetal; las estatinas pueden provocar malformaciones
      congénitas y aborto espontáneo. Contraindicado en el embarazo; suspender al
      menos 1 mes antes de intentar la concepción.
    ref: fda:label
  lactancia:
    compatibilidad: contraindicado
    enunciado: Debido al potencial de alterar el metabolismo lipídico del lactante,
      la lactancia natural está contraindicada durante el uso materno de atorvastatina.
    ref: fda:label
atencion_compartida:
  especialista: 'Cardiólogo, neurólogo o internista: estratifica el riesgo cardiovascular
    global post-evento agudo, prescribe la pauta intensiva (80 mg/día) y evalúa la
    adición de ezetimiba o inhibidores de PCSK9 si no se alcanzan objetivos diana.'
  seguimiento: 'Médico de atención primaria: vigila la adherencia terapéutica a largo
    plazo, solicita los controles lipídicos anuales, diferencia las mialgias benignas
    de la miositis y reajusta la pauta ante interacciones o intolerancia muscular.'
  suspension_inmediata:
  - Sospecha clínica de rabdomiólisis (dolor muscular incapacitante con orina oscura
    color té)
  - Elevación comprobada de CK > 10 veces el LSN
  - Ictericia o elevación severa de transaminasas > 5 veces el LSN
  ref: fda:label
posicionamiento:
  linea: primera
  escalonado:
  - linea: primera
    opciones: Atorvastatina 40-80 mg/día (estatina de alta intensidad) en pacientes
      con enfermedad cardiovascular establecida de muy alto riesgo.
  - linea: segunda
    opciones: Adición de ezetimiba 10 mg/día si no se alcanza la meta de c-LDL < 55
      mg/dL con dosis máxima tolerada de estatina.
  - linea: tercera
    opciones: Adición de inhibidores de PCSK9 (evolocumab, alirocumab) en pacientes
      de muy alto riesgo refractarios a la combinación oral.
  ref: pmid:15755765
