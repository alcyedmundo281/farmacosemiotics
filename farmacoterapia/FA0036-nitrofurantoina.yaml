# PARTE II — Farmacoterapia: cómo se usa la nitrofurantoína con seguridad.
id: 'FA:0036'
tipo: farmacoterapia
farmaco: 'FS:0036'

titulo: Farmacoterapia con nitrofurantoína en la infección urinaria baja
titulo_en: Nitrofurantoin pharmacotherapy in lower urinary tract infection

alcance: >-
  Fija lo que no cambia entre las indicaciones de la nitrofurantoína: la comprobación de función
  renal y de edad gestacional antes de la primera dosis, los puntos de corte que obligan a no
  empezar o a suspender, las dos interacciones que reducen la concentración urinaria activa, el
  perfil reproductivo y el reparto de actos entre la atención primaria y el especialista. Queda
  fuera, porque depende de la indicación, la dosis diana, la duración del ciclo y el balance entre
  beneficio y daño, que viven en cada ficha. Queda fuera también, por definición del fármaco,
  cualquier uso ajeno a la vía urinaria baja: la nitrofurantoína no alcanza concentraciones
  terapéuticas en el parénquima renal ni en el plasma.

estado: revisado
fecha: '2026-10-15'
actualizado: '2026-10-15'
idioma: es
autores:
