# PARTE II — Farmacoterapia: cómo se usa la amoxicilina con seguridad.
id: 'FA:0038'
tipo: farmacoterapia
farmaco: 'FS:0038'

titulo: Farmacoterapia con amoxicilina
titulo_en: Amoxicillin pharmacotherapy

alcance: >-
  Fija lo que no cambia entre las indicaciones de la amoxicilina: la verificación de la alergia
  antes de la primera dosis —que en este fármaco es la decisión de seguridad central y la que más
  se hace mal—, el ajuste por función renal, la conducta ante el exantema y ante la diarrea
  posantibiótica, las interacciones que modifican la dosis del otro fármaco, el perfil reproductivo
  y el reparto de actos. Sirve igual a la neumonía adquirida en la comunidad, a la faringitis
  estreptocócica, a la otitis media y a la erradicación de Helicobacter pylori, porque nada de lo
  anterior depende de la indicación. Queda fuera, por depender de ella, la dosis diana, la duración
  del ciclo y la línea de tratamiento. Queda fuera también la combinación con ácido clavulánico,
  que tiene otro perfil hepático y otra posición terapéutica.

estado: revisado
fecha: '2026-10-15'
actualizado: '2026-10-15'
idioma: es
