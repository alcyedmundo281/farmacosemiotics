# PARTE II — Farmacoterapia: cómo se usa la fenoximetilpenicilina con seguridad.
#
# Esta farmacoterapia se apoya en una fuente limitada, y eso gobierna su forma:
# la etiqueta estadounidense de la penicilina V potásica es de formato antiguo y
# no trae apartados de interacciones, de lactancia ni de ajuste renal. No es
# cosa de la etiqueta elegida: se revisaron las 20 etiquetas de
# `penicillin v potassium` indexadas en openFDA el 2026-10-15 y ninguna los
# trae. De ahí que `interacciones` quede declarado como hueco y que no se
# escriba umbral renal numérico.
#
# El tercer hueco, el de `monitorizacion`, tiene otra historia y está contada
# en su `motivo`: el apartado estuvo escrito, con un cultivo faríngeo de control
# al terminar el ciclo derivado de una frase de la etiqueta, y se retiró porque
# un cultivo de control universal convierte al portador asintomático en un
# fracaso aparente y genera retratamientos que no hacen falta. La frase de la
# etiqueta no bastaba para fijar a quién sí.
#
# La lactancia sí tiene dato propio de la molécula, y llegó tarde: la primera
# versión de este fichero la dejó en `sin_datos` por no haber buscado un estudio
# de transferencia a la leche de esta molécula en concreto. Existe.

id: 'FA:0039'
tipo: farmacoterapia
farmaco: 'FS:0039'

titulo: Farmacoterapia con fenoximetilpenicilina
titulo_en: Phenoxymethylpenicillin pharmacotherapy

alcance: >-
  Fija lo que no cambia entre las indicaciones de la penicilina V: la caracterización de la alergia
  a betalactámicos antes de la primera dosis, la comprobación de que la vía oral es fiable en este
  paciente —que en esta molécula no es una obviedad y la etiqueta lo advierte—, la conducta ante la
  erupción, ante la fiebre aislada y ante la diarrea posantibiótica, y el reparto de actos. Sirve
  igual a la faringoamigdalitis estreptocócica del grupo A, que es la indicación por la que esta
  molécula entra en el repositorio a través de SEL:0027, a la escarlatina y la erisipela leve, a la
  infección respiratoria neumocócica leve a moderada, a la fusoespiroquetosis del orofaringe y a la
  profilaxis secundaria continuada tras una fiebre reumática, porque nada de lo anterior depende de
  la indicación. Queda fuera, por depender de ella, la dosis diana, la duración del ciclo y la línea
  de tratamiento, con una salvedad que no es una excepción sino el punto de este fármaco: el mínimo
  de diez días en la infección estreptocócica no es una decisión de la indicación sino una
  propiedad del uso seguro de la molécula, y por eso se dice aquí.

