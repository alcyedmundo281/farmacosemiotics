# PARTE II — Farmacoterapia: cómo se usa la cefalexina con seguridad.
#
# Se escribe una sola vez y para dos temas, que es el desdoblamiento
# funcionando: la faringoamigdalitis estreptocócica de SEL:0027, donde esta
# molécula queda como alternativa, y la infección de piel y partes blandas, que
# es el tema siguiente de la oleada 2 y va a necesitar exactamente este mismo
# cribado, esta misma tabla de ajuste renal, estos mismos umbrales y este mismo
# perfil reproductivo. Nada de eso cambia entre una garganta y una celulitis.
# Lo que cambie —la línea de tratamiento, la dosis diana, el balance— irá en la
# ficha de cada indicación, y lo poco que una indicación aparte del cronograma
# común, en su apartado `variaciones`.

id: 'FA:0040'
tipo: farmacoterapia
farmaco: 'FS:0040'

titulo: Farmacoterapia con cefalexina
titulo_en: Cefalexin pharmacotherapy

alcance: >-
  Fija lo que no cambia entre las indicaciones de la cefalexina: la caracterización de la alergia a
  betalactámicos —que en esta molécula tiene una vuelta propia, porque es la que se le ofrece al
  alérgico a penicilina y no está libre de reactividad cruzada—, el ajuste de dosis por aclaramiento
  de creatinina, la vigilancia del paciente en riesgo de prolongación del tiempo de protrombina, la
  conducta ante la anemia, ante la crisis convulsiva, ante la reacción cutánea y ante la diarrea
  posantibiótica, las dos interacciones que la etiqueta documenta, el perfil reproductivo y el
  reparto de actos. Sirve igual a la faringoamigdalitis estreptocócica del grupo A de SEL:0027, a la
  infección de piel y partes blandas por Staphylococcus aureus sensible a meticilina o por
  Streptococcus pyogenes, a la otitis media, a la infección respiratoria, a la ósea y a la
  genitourinaria, que son las indicaciones que la etiqueta reconoce, porque nada de lo anterior
  depende de la indicación. Queda fuera, por depender de ella, la dosis diana, la duración del ciclo
  y la línea de tratamiento; y queda fuera la cefazolina, que es otra molécula con otra vía y otra
  ficha por escribir.

