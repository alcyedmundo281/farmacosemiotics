# Ficha: fármaco × indicación. Lo que SÍ depende de la indicación.
#
# Cada cifra de este fichero se transcribió del resumen que PubMed publica para
# el estudio citado, no de una fuente secundaria ni de memoria.

id: 'FT:0001'
tipo: ficha
farmaco: 'FS:0001'

titulo: Metformina en la diabetes mellitus tipo 2 del adulto
titulo_en: Metformin in type 2 diabetes mellitus in adults
indicacion: Diabetes mellitus tipo 2
indicacion_en: Type 2 diabetes mellitus
poblacion: >-
  Adultos con diabetes mellitus tipo 2 de diagnóstico reciente, con sobrepeso,
  sin síntomas de hiperglucemia tras un periodo inicial de dieta.
poblacion_en: >-
  Overweight adults with newly diagnosed type 2 diabetes without hyperglycaemic
  symptoms after initial dietary treatment.
cie11: 5A11

estado: revisado
fecha: '2026-08-24'
actualizado: '2026-08-24'
autores:
  - nombre: Alcy Torres
licencia: CC BY-SA 4.0

# ── Decisión Rápida en Punto de Atención ────────────────────────────────────
decision_clinica:
  semaforo: verde
  fuerza: fuerte
  perla_prescripcion: >-
    Fármaco de primera elección en DM2 del adulto con sobrepeso. Reduce mortalidad global (NNT 16 a 10.7 años).
    Iniciar con 500-850 mg con las comidas y titular lentamente cada 1-2 semanas para evitar intolerancia digestiva inicial.
  alerta_seguridad_inmediata: >-
    Comprobar siempre el filtrado glomerular: contraindicada con TFGe < 30 mL/min/1,73 m² por riesgo de acidosis láctica.

# ── Pregunta ────────────────────────────────────────────────────────────
pico:
  p: Adultos con sobrepeso y diabetes mellitus tipo 2 de diagnóstico reciente
  i: Control glucémico intensivo con metformina (dosis mediana 2550 mg/día)
  c: Política convencional, fundamentalmente dieta sola
  o: >-
    Mortalidad por cualquier causa, muerte relacionada con la diabetes,
    cualquier desenlace clínico relacionado con la diabetes, hipoglucemia,
    ganancia de peso

estrategia:
  - base: PubMed
    consulta: 'metformin[MeSH] AND "diabetes mellitus, type 2"[MeSH] AND randomized controlled trial[pt]'
    fecha: '2026-08-24'
    nota: >-
      La ficha se ancla en el ensayo pivotal UKPDS 34 (PMID 9742977) y en la
      revisión sistemática de acidosis láctica (PMID 20393934).

# ── Posología ───────────────────────────────────────────────────────────
posologia:
  inicio: 500 mg u 850 mg una o dos veces al día, con las comidas
  escalado: >-
    Subir de 500 en 500 mg cada una o dos semanas. El escalado lento no es una
    formalidad: es lo que decide si el paciente tolera el fármaco o lo abandona
    en la primera semana.
  mantenimiento: 1000 mg dos veces al día
  maxima: 2550 mg al día repartidos
  ajuste_renal: >-
    Contraindicada con filtrado glomerular estimado inferior a 30 mL/min/1,73 m².
    Entre 30 y 45 no se recomienda iniciarla, y si ya se estaba tomando conviene
    reevaluar el beneficio frente al riesgo.
  ref: 'fda:label'
  url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=014f2a32-8440-4d0c-8f5d-c4b3a49e0dec
  consultado: '2026-08-24'

# ── Evidencia ───────────────────────────────────────────────────────────
evidencia:
  - desenlace: Mortalidad por cualquier causa
    criticidad: critico
    diseno: eca
    estudio: UKPDS 34
    comparador: política convencional, fundamentalmente dieta sola
    n: 753
    seguimiento: mediana de 10,7 años
    tasa_intervencion: '14.5% (109/753)'
    tasa_control: '20.6% (85/411)'
    rra: '6.1%'
    rrr: '36% (IC95% 9–55)'
    efecto: reducción del riesgo del 36 % (IC95 % 9–55), p = 0,011
    nnt: 16
    horizonte_nnt: 10.7 años
    interpretacion_nnt: 'Tratar a 16 pacientes durante 10.7 años evita 1 muerte por cualquier causa.'
    certeza: moderada
    razones_descenso:
      - riesgo_de_sesgo
    ref: 'pmid:9742977'

  - desenlace: Muerte relacionada con la diabetes
    criticidad: critico
    diseno: eca
    estudio: UKPDS 34
    comparador: política convencional, fundamentalmente dieta sola
    n: 753
    seguimiento: mediana de 10,7 años
    efecto: reducción del riesgo del 42 % (IC95 % 9–63), p = 0,017
    rra: '4.8%'
    rrr: '42%'
    nnt: 21
    horizonte_nnt: 10.7 años
    certeza: moderada
    razones_descenso:
      - riesgo_de_sesgo
    ref: 'pmid:9742977'

  - desenlace: Cualquier desenlace clínico relacionado con la diabetes
    criticidad: importante
    diseno: eca
    estudio: UKPDS 34
    comparador: política convencional, fundamentalmente dieta sola
    n: 753
    seguimiento: mediana de 10,7 años
    efecto: reducción del riesgo del 32 % (IC95 % 13–47), p = 0,002
    rra: '10.3%'
    rrr: '32%'
    nnt: 10
    horizonte_nnt: 10.7 años
    certeza: moderada
    razones_descenso:
      - riesgo_de_sesgo
    ref: 'pmid:9742977'

  - desenlace: Acidosis láctica
    criticidad: critico
    diseno: revision_sistematica
    estudio: revisión Cochrane de 347 estudios comparativos y de cohortes
    comparador: otros antihiperglucemiantes
    n: 70490
    unidad_n: años-paciente con metformina
    efecto: >-
      ningún caso, mortal ni no mortal; límite superior de la incidencia real
      4,3 casos por 100 000 años-paciente frente a 5,4 sin metformina
    nnh: '>20000'
    certeza: moderada
    razones_descenso:
      - imprecision
    ref: 'pmid:20393934'

# ── Seguridad Cuantitativa ──────────────────────────────────────────────
seguridad_cuantitativa:
  - evento: Acidosis láctica asociada a metformina
    gravedad: mortal
    estudio: Revisión Cochrane
    ref: 'pmid:20393934'
    tasa_intervencion: '<0.005% (<4.3 casos/100.000 años-paciente)'
    tasa_control: '5.4 casos/100.000 años-paciente sin metformina'
    ria: '<0.001%'
    nnh: '>20000'
    horizonte_nnh: 1 año
    conducta: 'Respetar límites de TFGe y suspender temporalmente ante deshidratación o sepsis.'

# ── Balance ─────────────────────────────────────────────────────────────
balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: moderada
  valores_preferencias: >-
    Poca variabilidad esperable: pocos pacientes rechazarían un fármaco oral que
    reduce la mortalidad, no provoca hipoglucemia en monoterapia y no hace ganar
    peso. La intolerancia digestiva es el punto donde sí varía la preferencia, y
    es manejable con el escalado.
  equidad: >-
    Favorable. Genérico, de administración oral y en la lista básica de la OMS
    desde hace décadas, lo que lo hace accesible donde los antidiabéticos más
    nuevos no llegan.
  aceptabilidad: alta
  factibilidad: >-
    Alta, con una condición que no es trivial donde escasea el laboratorio:
    exige conocer el filtrado glomerular antes de iniciar y vigilarlo después.

# ── Recomendación ───────────────────────────────────────────────────────
recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda la metformina como tratamiento farmacológico inicial en el
    adulto con diabetes mellitus tipo 2 y sobrepeso, salvo contraindicación por
    función renal o acidosis metabólica.
  enunciado_en: >-
    Metformin is recommended as initial pharmacological therapy in overweight
    adults with type 2 diabetes mellitus, unless contraindicated by renal
    function or metabolic acidosis.
  ref: 'pmid:36151309'
  nota_consenso: >-
    El consenso ADA/EASD de 2022 sitúa la elección del primer fármaco en función
    del riesgo cardiovascular y renal, y ya no como una escalera fija que empieza
    siempre en metformina. La recomendación de esta ficha sigue siendo fuerte en
    su población —adulto con sobrepeso, sin enfermedad cardiovascular o renal
    establecida—, y esa acotación es la que la mantiene en pie.

alternativas:
  - dci: Gliclazida
    atc: A10BB09
    lme: true
    lme_seccion: '18.5.2'
    nota: >-
      Sulfonilurea del núcleo de la LME. Provoca hipoglucemia y ganancia de peso,
      los dos desenlaces donde la metformina salió mejor parada en UKPDS 34.
  - dci: Empagliflozina
    atc: A10BK03
    lme: true
    lme_seccion: '18.5.2'
    nota: >-
      Incorporada a la Lista Modelo con el peso de sus desenlaces
      cardiovasculares y renales. No tiene ficha propia aquí todavía.
  - dci: Insulina humana
    atc: A10AB01
    lme: true
    lme_seccion: '18.5.1'
    nota: >-
      En UKPDS 34 la metformina superó a la insulina en desenlaces relacionados
      con la diabetes, mortalidad total e ictus dentro del brazo intensivo.

conclusion: >-
  En el adulto con sobrepeso y diabetes tipo 2 de diagnóstico reciente, la
  metformina redujo la mortalidad total, la muerte relacionada con la diabetes y
  los desenlaces clínicos de la enfermedad frente a la política convencional, con
  menos hipoglucemias y menos ganancia de peso que la insulina y las
  sulfonilureas. La acidosis láctica, que motiva la advertencia con recuadro de
  la FDA, no pudo medirse en 70 490 años-paciente porque no aparecieron casos.
  Lo que de verdad limita su uso no es ese riesgo, sino el filtrado glomerular.

refs:
  - 'pmid:9742977'
  - 'pmid:20393934'
  - 'pmid:36151309'
