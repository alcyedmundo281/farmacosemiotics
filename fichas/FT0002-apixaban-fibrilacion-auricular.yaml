seleccion: 'SEL:0004'

titulo: Apixabán en la prevención de ictus en fibrilación auricular no valvular
titulo_en: Apixaban for stroke prevention in non-valvular atrial fibrillation
indicacion: Fibrilación auricular no valvular
indicacion_en: Non-valvular atrial fibrillation
poblacion: >-
  Adultos con fibrilación auricular no valvular y al menos un factor de riesgo adicional de ictus.
poblacion_en: >-
  Adults with non-valvular atrial fibrillation and at least one additional stroke risk factor.
cie11: BC81.3

estado: revisado
fecha: '2026-08-24'
actualizado: '2026-08-24'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  fuerza: fuerte
  perla_prescripcion: >-
    Anticoagulante oral de primera línea en FANV. Reduce ictus (NNT 303/año) y mortalidad (NNT 238/año)
    con menor sangrado mayor (RRR 31%) y 58% menos hemorragia intracraneal que warfarina. Dosis: 5 mg c/12h.
  alerta_seguridad_inmediata: >-
    Reducir dosis a 2.5 mg c/12h si cumple >=2 de 3: Edad >= 80 años, Peso <= 60 kg, Creatinina >= 1.5 mg/dL.

pico:
  p: Adultos con fibrilación auricular no valvular y al menos un factor de riesgo de ictus
  i: Apixabán 5 mg cada 12 horas (o 2.5 mg c/12h si cumplía criterios de ajuste)
  c: Warfarina sódica ajustada a INR 2.0-3.0
  o: Ictus, embolia sistémica, hemorragia mayor, hemorragia intracraneal, mortalidad global

estrategia:
  - base: PubMed
    consulta: 'apixaban AND "atrial fibrillation" AND "ARISTOTLE"'
    fecha: '2026-08-24'
    nota: Ensayo pivotal ARISTOTLE (PMID 21870978).

posologia:
  inicio: 5 mg cada 12 horas por vía oral
  mantenimiento: 5 mg cada 12 horas
  ajuste_renal: >-
    Reducir a 2.5 mg c/12h si creatinina sérica >= 1.5 mg/dL junto a edad >= 80 años o peso <= 60 kg.
    En TFGe 15-29 mL/min usar 2.5 mg c/12h con precaución.
  ref: 'fda:label'
  url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=4270d10a-867b-4029-a720-d464cf51cfba
  consultado: '2026-08-24'

