balance:
  efectos_deseables: grande
  efectos_indeseables: trivial
  certeza_global: alta
  valores_preferencias: >-
    Alta preferencia de los pacientes por la comodidad posológica sin necesidad
    de monitorización periódica de INR ni restricciones dietéticas estrictas.
  equidad: >-
    Sensible al costo en sistemas sin cobertura universal de anticoagulantes directos.
  aceptabilidad: alta
  factibilidad: alta

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda apixabán como anticoagulante oral preferente frente a warfarina
    en adultos con fibrilación auricular no valvular y riesgo tromboembólico.
  ref: 'pmid:21870978'

conclusion: >-
  En pacientes con fibrilación auricular no valvular, apixabán demostró superioridad
  frente a warfarina en la prevención de ictus y embolia sistémica, con menor mortalidad
  global y una reducción significativa del 31% en hemorragias mayores y del 58% en
  hemorragias intracraneales.

refs:
