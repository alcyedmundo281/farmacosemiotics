id: 'FT:0006'
tipo: ficha
farmaco: 'FS:0006'
titulo: Enalapril en la insuficiencia cardíaca con fracción de eyección reducida
indicacion: Insuficiencia cardíaca sintomática con fracción de eyección reducida (FEVI ≤ 35%)
indicacion_en: Symptomatic heart failure with reduced ejection fraction (HFrEF)
poblacion: Adultos con insuficiencia cardíaca crónica sintomática (NYHA II-IV) y disfunción sistólica ventricular izquierda (FEVI ≤ 35%)
cie11: BD11.0
estado: revisado
fecha: '2026-08-25'
actualizado: '2026-08-25'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

# ── Decisión Rápida en Punto de Atención ────────────────────────────────────
decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Pilar fundamental en IC-FEr: reduce mortalidad total (NNT 23 a 3.5 años) y
    hospitalización por IC (NNT 10). Iniciar a dosis baja (2.5 mg bid) y titular
    hasta 10–20 mg bid según tolerancia tensional, vigilando potasio y función renal a las 1–2 semanas.
  alerta_seguridad_inmediata: >-
    Contraindicado ante antecedente de angioedema por IECA o estenosis bilateral de la arteria renal.
    Suspender inmediatamente si se confirma embarazo.

# ── Pregunta PICO ────────────────────────────────────────────────────────────
pico:
  p: Adultos con insuficiencia cardíaca crónica y FEVI reducida (≤ 35%)
  i: Enalapril 2.5 a 20 mg al día (en dos tomas) añadido al tratamiento convencional
  c: Placebo añadido al tratamiento estándar (diuréticos ± digoxina)
  o: Mortalidad global por todas las causas, hospitalización por insuficiencia cardíaca, eventos adversos renales e hiperpotasemia

# ── Posología Práctica ───────────────────────────────────────────────────────
posologia:
  inicio: 2.5 mg por vía oral dos veces al día (1.25 mg si hipotensión o creatinina elevada)
  escalado: >-
    Duplicar la dosis cada 1 a 2 semanas según tolerancia hemodinámica y bioquímica.
    No conformarse con dosis bajas: el beneficio pronóstico demostrado en los ensayos pivote
    se obtuvo con dosis objetivo.
  mantenimiento: 10 mg a 20 mg dos veces al día
  maxima: 40 mg al día (20 mg dos veces al día)
  ajuste_renal: >-
    Si TFGe 30–50 mL/min, iniciar con 2.5 mg/día y titular con precaución.
    Si TFGe < 30 mL/min, iniciar con 2.5 mg/día bajo estrecha monitorización;
    un incremento de creatinina hasta el 30% es fisiológico y aceptable tras iniciar.
  ref: 'fda:label'

