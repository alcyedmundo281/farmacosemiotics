# ── Seguridad Cuantitativa (Toxicidad & NNH) ─────────────────────────────────
seguridad_cuantitativa:
  - evento: Mareo / Hipotensión sintomática
    gravedad: moderada
    tasa_intervencion: '11.0 %'
    tasa_control: '6.0 %'
    ria: '5.0%'
    nnh: 20
    horizonte_nnh: a 3 años
    conducta: 'Ajustar dosis de diuréticos si no hay congestión; separar tomas de otros antihipertensivos.'
    ref: 'pmid:2057034'

  - evento: Hiperpotasemia (K+ > 5.5 mEq/L)
    gravedad: grave
    tasa_intervencion: '6.4 %'
    tasa_control: '2.5 %'
    ria: '3.9%'
    nnh: 26
    horizonte_nnh: a 3 años
    conducta: 'Controlar ionograma a las 1–2 semanas; restringir suplementos de potasio y vigilar interacciones con ARM.'
    ref: 'pmid:2057034'

  - evento: Tos seca persistente mediada por bradicinina
    gravedad: leve
    tasa_intervencion: '3.7 %'
    tasa_control: '1.8 %'
    ria: '1.9%'
    nnh: 53
    horizonte_nnh: a 3 años
    conducta: 'Si resulta intolerable para el paciente, cambiar a un ARA-II (losartán, valsartán).'
    ref: 'pmid:2057034'

# ── Juicio de Balance GRADE ──────────────────────────────────────────────────
balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

# ── Recomendación Formal ─────────────────────────────────────────────────────
recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda el tratamiento con Enalapril (o IECA equivalente / ARNI) en todos los pacientes
    con insuficiencia cardíaca sintomática con fracción de eyección reducida (FEVI ≤ 35%),
    salvo contraindicación o intolerancia demostrada, para reducir la mortalidad y las hospitalizaciones.
  ref: 'pmid:2057034'

# ── Alternativas Terapéuticas ────────────────────────────────────────────────
alternativas:
  - dci: Sacubitrilo / Valsartán
    atc: C09DX04
    lme: true
    lme_seccion: '12.3'
    nota: 'Inhibidor de neprilisina y receptor de angiotensina (ARNI); superior a IECA en reducción adicional de mortalidad CV.'
  - dci: Losartán
    atc: C09CA01
    lme: true
    lme_seccion: '12.3'
    nota: 'Antagonista de los receptores de angiotensina II (ARA-II); opción de elección en caso de tos intolerable por IECA.'

conclusion: >-
  Enalapril cuenta con evidencia de certeza alta (ensayos SOLVD y CONSENSUS) que demuestra un beneficio
  rotundo en supervivencia global (NNT 23) y reducción de descompensaciones (NNT 10). Sus efectos adversos
  (hipotensión y tos) son manejables en la práctica clínica mediante titulación prudente y monitorización bioquímica.

refs:
