    rra: '4.5%'
    rrr: '11.3%'
    nnt: 23
    horizonte_nnt: a 3.5 años
    diseno: eca
    estudio: SOLVD Treatment (1991)
    comparador: Placebo + tratamiento estándar
    n: 2569
    certeza: alta
    razones_descenso: []
