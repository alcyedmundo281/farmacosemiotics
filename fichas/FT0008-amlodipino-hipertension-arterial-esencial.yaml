# CORRECCIÓN DE PROCEDENCIA (2026-09-05).
#
# Esta ficha citaba `pmid:12479763` —ALLHAT— para tres cosas, y solo una estaba
# en el artículo.
#
# Lo que SÍ estaba y se conserva: el desenlace primario, sin diferencia frente a
# clortalidona. Se le quitaron el NNT y las reducciones de riesgo, porque un NNT
# sobre un intervalo de confianza que cruza el 1 afirma un beneficio que el
# ensayo no demostró, y porque las tasas que publica el resumen son a 6 años y
# no a 5.
#
# Lo que NO estaba: las incidencias de edema maleolar y de cefalea o rubefacción
# —10,7 % frente a 3,2 %, NNH 14; 3,5 % frente a 1,5 %, NNH 50— y la conducta
# de asociar un IECA o un ARA-II «que normaliza la presión capilar». El resumen
# accesible de ALLHAT no publica tasas de efectos adversos, y su texto completo
# no fue alcanzable en esta sesión, de modo que esas cifras no se pueden señalar
# en ningún fichero de `referencias/`. Se retiran las cifras y la conducta; los
# eventos se conservan, porque son reales, y quedan como reacciones sin
# cuantificar, que es donde el desdoblamiento del repositorio los coloca: el
# hecho cualitativo vive en FS:0008 y aquí solo debería estar lo que esta
# indicación cuantifica.
#
# Lo que FALTABA, y es lo que más pesa: ALLHAT encontró con amlodipino una tasa
# de insuficiencia cardíaca a 6 años más alta que con clortalidona. La ficha
# citaba el ensayo para su resultado nulo favorable y omitía su hallazgo
# desfavorable. Ahora está, con su NNH calculado sobre las tasas publicadas.
#
# Queda una cosa por decidir que NO se tocó, porque es un juicio clínico del
# autor y no una cuestión de procedencia: `balance.efectos_indeseables` sigue en
# `pequeno`, y se fijó antes de que constara esta señal de insuficiencia
# cardíaca con NNH 40. Conviene releerlo.

id: 'FT:0008'
tipo: ficha
farmaco: 'FS:0008'
titulo: Amlodipino en la hipertensión arterial esencial
indicacion: Hipertensión arterial esencial del adulto
indicacion_en: Essential hypertension in adults
poblacion: Adultos con hipertensión arterial primaria (estadio 1 o 2), con o sin factores de riesgo cardiovascular adicionales
cie11: BA00
estado: revisado
fecha: '2026-08-25'
actualizado: '2026-08-25'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

# ── Decisión Rápida en Punto de Atención ────────────────────────────────────
decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Antihipertensivo de primera línea con control tensional suave y prolongado (24 h) en toma única.
    Especialmente eficaz en ancianos, personas de raza negra e hipertensión sistólica aislada.
    Reduce eventos cardiovasculares mayores e ictus (NNT 100 a 5.5 años).
  alerta_seguridad_inmediata: >-
    En ALLHAT la tasa de insuficiencia cardíaca a 6 años fue más alta que con
    clortalidona: 10,2 % frente a 7,7 % (RR 1,38; IC95 % 1,25-1,52), NNH 40.
    Es el único desenlace en que salió peor que su comparador. Vigilar también
    el edema maleolar, sin cifra: la que constaba aquí no tenía fuente.

# ── Pregunta PICO ────────────────────────────────────────────────────────────
pico:
  p: Adultos hipertensos (≥ 55 años) con al menos un factor de riesgo cardiovascular adicional
  i: Amlodipino 5 a 10 mg al día
  c: Clortalidona / Lisinopril (ensayo ALLHAT) o Atenolol ± diurético (ensayo ASCOT-BPLA)
  o: Mortalidad por todas las causas, ictus mortal y no mortal, eventos coronarios, edema periférico

# ── Posología Práctica ───────────────────────────────────────────────────────
posologia:
  inicio: 5 mg por vía oral una vez al día (2.5 mg en ancianos o pacientes frágiles)
  escalado: >-
    Si tras 2 a 4 semanas no se alcanza la meta de presión arterial (< 130/80 mmHg),
    titular a 10 mg/día o, preferiblemente, asociar un IECA/ARA-II a dosis fija.
  mantenimiento: 5 mg a 10 mg una vez al día
  maxima: 10 mg al día
  ajuste_renal: >-
    No requiere ajuste de dosis en insuficiencia renal leve, moderada ni grave. No es dializable.
  ref: 'fda:label'

# ── Evidencia Clínica Cuantitativa (Eficacia & NNT) ──────────────────────────
evidencia:
  - desenlace: Ictus mortal y no mortal a 5.5 años
    criticidad: critico
    efecto: 'Reducción relativa del 23 % frente a pauta basada en atenolol (HR 0.77, IC 95 % 0.66–0.89), p = 0.0003'
    rra: '1.0%'
    rrr: '22.7%'
    nnt: 100
    horizonte_nnt: a 5.5 años
    diseno: eca
    estudio: ASCOT-BPLA (2005)
    comparador: Pauta basada en atenolol ± tiazida
    n: 19257
    certeza: alta
    razones_descenso: []
    ref: 'pmid:16154016'

  - desenlace: Mortalidad por todas las causas a 5.5 años
    criticidad: critico
    efecto: 'Reducción relativa del 11 % frente a pauta basada en betabloqueante (HR 0.89, IC 95 % 0.81–0.99), p = 0.025'
    rra: '0.8%'
    rrr: '9.4%'
    nnt: 125
    horizonte_nnt: a 5.5 años
    diseno: eca
    estudio: ASCOT-BPLA (2005)
    comparador: Pauta basada en atenolol
    n: 19257
    certeza: alta
    razones_descenso: []
    ref: 'pmid:16154016'

  - desenlace: Enfermedad coronaria mortal o infarto de miocardio no mortal
    criticidad: critico
    efecto: >-
      Sin diferencia frente a clortalidona: tasas a 6 años del 11,3 % con
      amlodipino y del 11,5 % con clortalidona (RR 0,98; IC95 % 0,90-1,07).
      Tampoco hubo diferencia en mortalidad por cualquier causa. Sin NNT: el
      intervalo de confianza cruza el 1 y un NNT afirmaría un beneficio que el
      ensayo no demostró.
    seguimiento: media de 4,9 años; tasas publicadas a 6 años
    diseno: eca
    estudio: ALLHAT (2002)
    comparador: Clortalidona
    n: 33357
    certeza: alta
    razones_descenso: []
    ref: 'pmid:12479763'

# ── Seguridad Cuantitativa (Toxicidad & NNH) ─────────────────────────────────
seguridad_cuantitativa:
  # El daño cuantificado que ALLHAT sí publica, y que esta ficha no recogía.
  - evento: Insuficiencia cardíaca
    gravedad: grave
    tasa_intervencion: '10.2 % a 6 años'
    tasa_control: '7.7 % a 6 años'
    ria: '2.5%'
    nnh: 40
    horizonte_nnh: a 6 años
    conducta: >-
      Tratar a 40 pacientes durante 6 años con amlodipino en lugar de
      clortalidona produce un caso más de insuficiencia cardíaca (RR 1,38;
      IC95 % 1,25-1,52). Es el único desenlace en que el amlodipino salió peor
      que su comparador, y la conclusión del propio ensayo fue que los
      diuréticos de tipo tiazídico deberían preferirse como tratamiento
      antihipertensivo de primer paso. Valorarlo antes de elegirlo en quien ya
      parte con riesgo de insuficiencia cardíaca.
    ref: 'pmid:12479763'

  # Los dos siguientes conservan el evento y pierden las cifras: las
  # incidencias que traían se atribuían a ALLHAT, cuyo resumen no publica tasas
  # de efectos adversos. Sin fuente que señalar, el número no se escribe.
  - evento: Edema periférico o maleolar dependiente de dosis
    gravedad: leve
    conducta: >-
      Sin cuantificar en esta indicación y sin conducta escrita: la incidencia y
      el manejo que constaban aquí citaban un ensayo de desenlaces que no los
      publica. FA:0008 declara el hueco en su `alcance`. La reacción, como hecho
      cualitativo de la molécula, sigue en FS:0008.
    ref: 'fda:label'

  - evento: Cefalea o rubefacción facial por vasodilatación
    gravedad: leve
    conducta: >-
      Sin cuantificar en esta indicación, por la misma razón que el edema.
    ref: 'fda:label'

# ── Juicio de Balance GRADE ──────────────────────────────────────────────────
balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

# ── Recomendación Formal ─────────────────────────────────────────────────────
recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda Amlodipino (5 a 10 mg/día) como una de las opciones de primera línea en monoterapia o en combinación
    con IECA/ARA-II para el control de la hipertensión arterial esencial y la reducción de eventos cerebrovasculares.
  ref: 'pmid:16154016'

# ── Alternativas Terapéuticas ────────────────────────────────────────────────
alternativas:
  - dci: Enalapril
    atc: C09AA02
    lme: true
    lme_seccion: '12.3'
    nota: 'IECA de primera línea; combinación sinérgica preferente con amlodipino.'
  - dci: Hidroclorotiazida
    atc: C03AA03
    lme: true
    lme_seccion: '12.3'
    nota: 'Diurético tiazídico alternativo para terapia combinada de primera línea.'

conclusion: >-
  Amlodipino es un pilar del tratamiento antihipertensivo, con evidencia sólida
  de reducción de ictus frente a una pauta basada en atenolol (NNT 100 a 5,5
  años, ASCOT-BPLA) y sin diferencia frente a clortalidona en enfermedad
  coronaria ni en mortalidad (ALLHAT). El contrapeso está en el mismo ensayo y
  esta ficha lo omitía: la tasa de insuficiencia cardíaca a 6 años fue más alta
  con amlodipino que con clortalidona —10,2 % frente a 7,7 %; RR 1,38;
  IC95 % 1,25-1,52; NNH 40—, y ALLHAT concluyó que los diuréticos de tipo
  tiazídico deberían preferirse como tratamiento de primer paso. Su efecto
  adverso más frecuente, el edema maleolar, queda sin cuantificar y sin conducta
  escrita: la incidencia y el manejo que constaban aquí se atribuían a un ensayo
  de desenlaces que no los publica, y no se localizó otra fuente.

refs:
