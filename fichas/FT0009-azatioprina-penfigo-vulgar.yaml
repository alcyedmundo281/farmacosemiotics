# Guía de práctica clínica farmacoterapéutica: fármaco × indicación.
#
# Es la primera del repositorio que estrena la capa de GPC —cribado basal,
# estratificación farmacogenética, cronograma de monitorización, interacciones
# que cambian la conducta y seguridad reproductiva— y por eso conviene leerla
# como plantilla de lo que se espera de las siguientes.
#
# Cada cifra sale del artículo citado en su `ref`. Lo que no tiene fuente no
# está: los apartados que faltan se declaran en `huecos_declarados`, con el
# motivo, para que una ausencia buscada no se confunda con un olvido.

id: 'FT:0009'
tipo: ficha
farmaco: 'FS:0009'

titulo: Azatioprina como ahorrador de corticoide en el pénfigo vulgar
titulo_en: Azathioprine as a corticosteroid-sparing agent in pemphigus vulgaris
indicacion: Pénfigo vulgar
indicacion_en: Pemphigus vulgaris
poblacion: >-
  Personas adultas con pénfigo vulgar confirmado, en tratamiento con
  corticoide sistémico, en quienes se plantea un inmunosupresor adyuvante para
  reducir la exposición acumulada al corticoide.
poblacion_en: >-
  Adults with confirmed pemphigus vulgaris on systemic corticosteroids in whom
  an adjuvant immunosuppressant is considered to reduce cumulative
  corticosteroid exposure.
cie11: EB40

estado: borrador
fecha: '2026-09-04'
actualizado: '2026-09-04'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

# ── Decisión Rápida en Punto de Atención ────────────────────────────────
decision_clinica:
  semaforo: amarillo
  fuerza: condicional
  perla_prescripcion: >-
    Adyuvante ahorrador de corticoide, ya no la primera opción: el rituximab
    está aprobado en primera línea para el pénfigo vulgar moderado y grave en
    Europa y en Estados Unidos. Antes de la primera dosis, genotipar TPMT y
    NUDT15: es lo único que separa una titulación tranquila de una
    mielosupresión evitable.
  alerta_seguridad_inmediata: >-
    Nunca junto a alopurinol o febuxostat sin reducir la dosis: el inhibidor de
    la xantina oxidasa desvía el metabolismo hacia los nucleótidos activos y
    multiplica el riesgo de mielosupresión.

# ── Pregunta ────────────────────────────────────────────────────────────
pico:
  p: Adultos con pénfigo vulgar en tratamiento corticoideo sistémico
  i: Azatioprina como inmunosupresor adyuvante
  c: >-
    Corticoide solo, u otro adyuvante (micofenolato), o rituximab en primera
    línea en la enfermedad moderada y grave
  o: >-
    Remisión, dosis acumulada de corticoide, recaída, mielosupresión,
    hepatotoxicidad

estrategia:
  - base: PubMed
    consulta: 'pemphigus[MeSH] AND azathioprine[MeSH] AND guideline[pt]'
    fecha: '2026-09-04'
    nota: >-
      La guía se ancla en los dos consensos europeos del pénfigo (EDF/EADV
      2014 y su actualización EADV 2020) para el posicionamiento, en la guía
      CPIC de tiopurinas para la dosificación por genotipo, y en la guía de la
      BSR de embarazo y lactancia para la seguridad reproductiva.

# ── Posología ───────────────────────────────────────────────────────────
posologia:
  inicio: >-
    La dosis de inicio depende del genotipo de TPMT y NUDT15: ver la
    estratificación farmacogenética. En metabolizador normal para ambos genes
    se emplea la dosis plena de la indicación.
  escalado: >-
    La dosis guiada por genotipo es solo la dosis de partida. El ajuste
    posterior se hace titulando contra el grado de mielosupresión, y no antes
    de dos a cuatro semanas, que es cuando se alcanza el estado estacionario.
  ref: 'pmid:30447069'

# ── Estratificación farmacogenética ─────────────────────────────────────
# La TPMT explica la intolerancia a tiopurinas sobre todo en población europea
# y africana; la NUDT15, en población asiática e hispana. Genotipar solo una de
# las dos deja fuera a una parte de los pacientes según su ascendencia, y por
# eso este repositorio, que es internacional, las trata como un solo bloque.
farmacogenetica:
  gen: TPMT y NUDT15
  prueba: genotipado antes de la primera dosis
  nota: >-
    La actividad de TPMT se hereda como rasgo monogénico autosómico
    codominante, y tres polimorfismos explican más del 90 % de los fenotipos de
    actividad baja, de modo que un genotipado que los incluya informa del
    fenotipo con alta probabilidad. Las recomendaciones valen igual si la
    actividad se midió por fenotipo en vez de por genotipo.
  fenotipos:
    - fenotipo: TPMT metabolizador normal
      conducta: >-
        Dosis de inicio plena de la indicación. La titulación posterior sigue
        siendo necesaria.
      ref: 'pmid:30447069'

    - fenotipo: TPMT metabolizador intermedio
      dosis: 30-80 % de la dosis diana
      conducta: >-
        En enfermedad no maligna, dosis reducida. Solo un 30-60 % de los
        heterocigotos no tolera la dosis plena, así que reducir de entrada
        expone a algunos a unas semanas de infradosificación; como el estado
        estacionario llega en dos a cuatro semanas, ese periodo es corto.
      ref: 'pmid:30447069'

    - fenotipo: TPMT metabolizador lento
      conducta: >-
        Dosis sustancialmente reducida, o directamente otro fármaco. Con dos
        alelos sin función, la dosis convencional conlleva riesgo muy alto de
        mielosupresión potencialmente mortal.
      ref: 'pmid:30447069'

    - fenotipo: NUDT15 metabolizador normal
      conducta: No hace falta alterar la dosis de inicio.
      ref: 'pmid:30447069'

    - fenotipo: NUDT15 metabolizador intermedio
      conducta: >-
        Considerar dosis de inicio reducida, sobre todo si la dosis de partida
        de la indicación es alta.
      ref: 'pmid:30447069'

    - fenotipo: NUDT15 metabolizador lento
      frecuencia: >-
        Alrededor de 1 de cada 50 personas de ascendencia asiática oriental, y
        más frecuente en población hispana, en particular con alta ascendencia
        amerindia
      conducta: >-
        Dosis sustancialmente reducida o fármaco alternativo. La reducción es
        preventiva y se recomienda con fuerza: la dosis plena supone riesgo
        grave de toxicidad hematopoyética prolongada.
      ref: 'pmid:30447069'

# ── Cribado antes de la primera dosis ───────────────────────────────────
cribado_basal:
  - prueba: Genotipado de TPMT
    motivo: >-
      Fijar la dosis de inicio y detectar al metabolizador lento antes de
      exponerlo
    responsable: especialista
    ref: 'pmid:30447069'

  - prueba: Genotipado de NUDT15
    motivo: >-
      Misma decisión de dosis por una vía metabólica distinta; es la que rinde
      en población asiática e hispana, donde la TPMT sola dejaría casos fuera
    responsable: especialista
    ref: 'pmid:30447069'

  - prueba: Hemograma completo
    motivo: >-
      Punto de partida sin el cual la primera citopenia del tratamiento no
      puede interpretarse
    responsable: especialista
    ref: 'pmid:30447069'

# ── Cronograma de monitorización ────────────────────────────────────────
monitorizacion:
  - fase: basal
    pruebas:
      - Genotipado de TPMT
      - Genotipado de NUDT15
      - Hemograma completo
    responsable: especialista
    ref: 'pmid:30447069'

  - fase: induccion
    periodo: Desde la primera dosis hasta alcanzar la dosis de mantenimiento
    pruebas:
      - Hemograma completo
      - Signos clínicos de mielosupresión
    frecuencia: >-
      Antes de cada escalado, y nunca antes de dos a cuatro semanas del
      anterior: por debajo de ese plazo no se ha alcanzado el estado
      estacionario y la cifra todavía no dice lo que parece decir
    responsable: compartida
    ref: 'pmid:30447069'

# ── Interacciones que cambian la conducta ───────────────────────────────
interacciones:
  - con: Alopurinol y febuxostat (inhibidores de la xantina oxidasa)
    gravedad: mayor
    efecto: >-
      Bloquean la vía de inactivación por xantina oxidasa y desvían el
      metabolismo hacia los nucleótidos de tioguanina activos
    conducta: >-
      No asociar sin reducir sustancialmente la dosis de azatioprina y
      estrechar la vigilancia hematológica. La combinación es una causa clásica
      y evitable de mielosupresión grave.
    ref: 'fda:label'
    nota: >-
      La conducta procede de la ficha técnica del producto y no de las guías
      citadas en el resto de esta ficha. Queda anclada a `fda:label` a la
      espera de que `scripts/openfda.py` fije el `setid` y la fecha de consulta.

# ── Evidencia ───────────────────────────────────────────────────────────
evidencia:
  - desenlace: >-
      Posicionamiento de la azatioprina como adyuvante frente a las
      alternativas
    criticidad: critico
    diseno: guia
    estudio: >-
      Consenso S2 del European Dermatology Forum con la EADV, y su
      actualización S2K de 2020
    comparador: Corticoide solo u otros adyuvantes
    efecto: >-
      Los dos consensos coinciden en que, por la rareza de la enfermedad, se
      dispone de pocos ensayos terapéuticos controlados. La actualización de
      2020 registra el cambio que reordena el escalón: el rituximab pasó a estar
      aprobado como tratamiento de primera línea del pénfigo vulgar moderado y
      grave en Europa y en Estados Unidos.
    certeza: baja
    razones_descenso:
      - imprecision
      - evidencia_indirecta
    ref: 'pmid:32830877'

  - desenlace: Marco diagnóstico y terapéutico de referencia
    criticidad: importante
    diseno: consenso
    estudio: >-
      Guía S2 del European Dermatology Forum en cooperación con la EADV y la
      UEMS
    efecto: >-
      Antes de la era del tratamiento inmunosupresor el pronóstico del pénfigo
      era casi siempre mortal; el consenso se elaboró precisamente porque la
      rareza de la enfermedad deja pocos ensayos prospectivos controlados en
      los que apoyarse.
    certeza: baja
    razones_descenso:
      - imprecision
      - riesgo_de_sesgo
    ref: 'pmid:25338479'

# ── Posicionamiento terapéutico ─────────────────────────────────────────
posicionamiento:
  linea: segunda
  justificacion: >-
    La azatioprina conserva su papel de inmunosupresor adyuvante ahorrador de
    corticoide, pero ya no encabeza el escalón: la aprobación del rituximab en
    primera línea para la enfermedad moderada y grave desplazó su posición.
  escalonado:
    - linea: primera
      opciones:
        - Rituximab en el pénfigo vulgar moderado y grave
      nota: >-
        Aprobado como tratamiento de primera línea en Europa y en Estados
        Unidos, según la actualización de 2020.
    - linea: segunda
      opciones:
        - Azatioprina como adyuvante del corticoide sistémico
      nota: >-
        Papel de ahorrador de corticoide, con la dosis fijada por el genotipo
        de TPMT y NUDT15.
  ref: 'pmid:32830877'

# ── Seguridad reproductiva ──────────────────────────────────────────────
# El apartado que las guías de inmunosupresores suelen resolver con un «evitar»
# genérico, y que aquí se cita entero: la azatioprina es la excepción amable de
# su clase, y decirlo con procedencia evita suspensiones innecesarias.
reproductivo:
  gestacion:
    compatibilidad: compatible
    enunciado: >-
      Compatible durante todo el embarazo (GRADE 1B, grado de acuerdo 100 %).
      La tabla de compatibilidad la da por aceptable en la periconcepción, el
      primer trimestre y el segundo y tercero, y también con exposición
      paterna. No se identificaron desenlaces adversos del embarazo en 1019
      exposiciones maternas, y no hay evidencia clara de un límite de dosis; el
      uso a dosis eficaz debe apoyarse en la monitorización analítica.
    ref: 'pmid:36318966'
  lactancia:
    compatibilidad: compatible
    enunciado: >-
      Compatible con la lactancia (GRADE 2C, grado de acuerdo 99,5 %). Se
      detectaron cantidades mínimas en la leche y no se identificaron efectos
      adversos. Evitar la lactancia durante las cuatro horas siguientes a la
      toma reduce marcadamente la dosis que recibe el lactante.
    ref: 'pmid:36318966'
  anticoncepcion:
    requerida: false
    enunciado: >-
      La azatioprina no exige por sí misma anticoncepción de alta eficacia ni
      periodo de lavado previo a la concepción, a diferencia de otros
      inmunosupresores de su entorno: la ciclofosfamida queda reservada a
      circunstancias excepcionales en el embarazo y desaconsejada en lactancia
      y exposición paterna, el metotrexato exige suspenderlo al menos un mes
      antes de concebir y el micofenolato al menos seis semanas.
    ref: 'pmid:36318966'

# ── Huecos declarados ───────────────────────────────────────────────────
# Se buscó fuente para estos apartados y no se encontró una que pudiera
# citarse. Declararlos es lo que impide que la guía parezca completa.
huecos_declarados:
  - bloque: umbrales_accion
    motivo: >-
      No se localizó fuente de acceso abierto que fije los puntos de corte
      numéricos de neutropenia, trombocitopenia y elevación de transaminasas
      para esta molécula. Escribir un umbral verosímil sería justamente el
      fallo que este repositorio existe para impedir: un número con formato
      clínico y sin procedencia.
    buscado_en: >-
      Guía de la BSR para la prescripción y monitorización de csDMARD y guía
      de la BAD para la prescripción segura de azatioprina: ninguna de las dos
      con texto completo accesible desde el entorno de compilación.
    refs:
      - 'pmid:41235543'
      - 'pmid:21950502' 

  - bloque: atencion_compartida
    motivo: >-
      El reparto de responsabilidades entre especialista y médico de
      seguimiento requiere transcribir el acuerdo de atención compartida, y no
      se dispuso del texto completo de la guía que lo fija.
    buscado_en: >-
      Guía de la BSR para la prescripción y monitorización de csDMARD, que es
      donde vive el modelo de acuerdo de atención compartida.
    refs:
      - 'pmid:41235543'

# ── Balance ─────────────────────────────────────────────────────────────
balance:
  efectos_deseables: moderado
  efectos_indeseables: moderado
  certeza_global: baja
  valores_preferencias: >-
    Variabilidad esperable alta. Frente a un adyuvante oral y barato, con
    dosificación ajustable por genotipo y compatible con el embarazo y la
    lactancia, está un anticuerpo monoclonal de administración hospitalaria con
    aprobación en primera línea. El peso que cada paciente dé a la vía oral, al
    coste y al deseo gestacional mueve la elección más que la eficacia.
  equidad: >-
    Favorable en cuanto al fármaco, que es oral y genérico, pero condicionada
    por el genotipado previo. Donde no hay acceso a TPMT y NUDT15, la
    estratificación que hace segura la dosis de inicio no puede aplicarse, y
    esa es la barrera real de esta guía.
  aceptabilidad: alta
  factibilidad: >-
    Depende del genotipado. Sin él, la alternativa es titular a ciegas con
    vigilancia hematológica estrecha, que es lo que la guía CPIC busca evitar.

# ── Recomendación ───────────────────────────────────────────────────────
recomendacion:
  direccion: a_favor
  fuerza: condicional
  enunciado: >-
    Se sugiere la azatioprina como inmunosupresor adyuvante ahorrador de
    corticoide en el pénfigo vulgar, con la dosis de inicio fijada por el
    genotipo de TPMT y NUDT15, en pacientes en quienes el rituximab no es la
    opción de primera línea o no está disponible.
  enunciado_en: >-
    Azathioprine is suggested as an adjuvant corticosteroid-sparing
    immunosuppressant in pemphigus vulgaris, with the starting dose set by TPMT
    and NUDT15 genotype, in patients for whom first-line rituximab is not
    indicated or not available.
  ref: 'pmid:32830877'
  justificacion_fuerza: >-
    Condicional y no fuerte por dos motivos que van en la misma dirección: la
    base de ensayos controlados es escasa por la rareza de la enfermedad, y el
    posicionamiento cambió al aprobarse el rituximab en primera línea para la
    enfermedad moderada y grave.

alternativas:
  - dci: Rituximab
    atc: L01FA01
    lme: false
    nota: >-
      Aprobado en primera línea para el pénfigo vulgar moderado y grave en
      Europa y en Estados Unidos. No tiene guía propia aquí todavía.
  - dci: Micofenolato de mofetilo
    atc: L04AA06
    lme: false
    nota: >-
      El otro adyuvante clásico del corticoide. En seguridad reproductiva es lo
      contrario de la azatioprina: exige suspenderlo al menos seis semanas
      antes de concebir.

conclusion: >-
  En el pénfigo vulgar, la azatioprina sigue siendo un adyuvante razonable del
  corticoide, pero su sitio se movió: la actualización europea de 2020 recoge
  que el rituximab pasó a estar aprobado en primera línea para la enfermedad
  moderada y grave. Lo que decide si la azatioprina se usa bien no es la
  eficacia sino la dosis de partida, y esa depende del genotipo de TPMT y
  NUDT15: dos genes cuya frecuencia varía con la ascendencia, de modo que
  genotipar solo uno deja pacientes desprotegidos según de dónde vengan. En
  seguridad reproductiva es la excepción amable de su clase, compatible con el
  embarazo y con la lactancia, mientras el micofenolato y el metotrexato exigen
  suspensión previa a la concepción. Los puntos de corte analíticos que
  completarían esta guía quedan declarados como hueco, no resueltos de memoria.

refs:
