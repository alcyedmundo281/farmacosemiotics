    rra: '3.3%'
    rrr: '15.8%'
    nnt: 31
    horizonte_nnt: a 2.6 años
    diseno: eca
    estudio: FIDELIO-DKD (2020)
    comparador: Placebo + dosis máxima tolerada de IECA o ARA-II
    n: 5734
    certeza: alta
    razones_descenso: []
    ref: 'pmid:33264825'

  - desenlace: Compuesto cardiovascular secundario clave (muerte cardiovascular, IAM no fatal, ictus no fatal o ingreso por insuficiencia cardíaca)
    criticidad: critico
    efecto: 'Reducción relativa del 14 % (HR 0.86, IC 95 % 0.75–0.99), p = 0.03'
    rra: '1.8%'
    rrr: '14.0%'
    nnt: 56
    horizonte_nnt: a 2.6 años
    diseno: eca
    estudio: FIDELIO-DKD (2020)
    comparador: Placebo + tratamiento estándar
