# ── Seguridad Cuantitativa (Toxicidad & NNH) ─────────────────────────────────
seguridad_cuantitativa:
  - evento: Hiperpotasemia que conduce a la suspensión permanente del tratamiento
    gravedad: moderada
    tasa_intervencion: '2.3 %'
    tasa_control: '0.9 %'
    ria: '1.4%'
    nnh: 72
    horizonte_nnh: a 2.6 años
    conducta: >-
      Suspender inmediatamente finerenona si potasio sérico > 5.5 mEq/L. Reiniciar con 10 mg/día
      únicamente cuando el potasio sérico descienda a ≤ 4.8 mEq/L.
    ref: 'pmid:33264825'

# ── Juicio de Balance GRADE ──────────────────────────────────────────────────
balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

# ── Recomendación Formal ─────────────────────────────────────────────────────
recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda añadir Finerenona (10 o 20 mg/día) al tratamiento estándar en pacientes con diabetes
    tipo 2 y enfermedad renal crónica con albuminuria persistente (UACR ≥ 30 mg/g) a pesar de la dosis
    máxima tolerada de IECA o ARA-II (con TFGe ≥ 25 mL/min/1.73 m² y potasio sérico basal ≤ 4.8 mEq/L)
    para enlentecer la progresión a diálisis y reducir la morbimortalidad cardiovascular.
  ref: 'pmid:36189689'

# ── Alternativas Terapéuticas ────────────────────────────────────────────────
alternativas:
  - dci: Empagliflozina
    atc: A10BK03
    lme: true
    lme_seccion: '18.5.2'
    nota: 'iSGLT2 de primera línea con nefroprotección y reducción de eventos cardiovasculares en diabetes tipo 2 con ERC.'

conclusion: >-
  Finerenona aporta protección cardiorrenal complementaria demostrada en desenlaces duros (NNT 31 en progresión renal,
  NNT 56 en eventos cardiovasculares) con una seguridad manejable protocolizando el control de potasio a las 4 semanas (NNH 72).

