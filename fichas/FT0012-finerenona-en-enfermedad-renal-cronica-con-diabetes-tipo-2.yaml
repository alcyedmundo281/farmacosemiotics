id: 'FT:0012'
tipo: ficha
farmaco: 'FS:0011'
seleccion: 'SEL:0005'
titulo: Finerenona en la enfermedad renal crónica asociada a diabetes tipo 2
indicacion: Enfermedad renal crónica con albuminuria persistente en diabetes mellitus tipo 2
indicacion_en: Chronic kidney disease with persistent albuminuria in type 2 diabetes
poblacion: Adultos con diabetes tipo 2 y ERC con albuminuria persistente (UACR ≥ 30 mg/g) bajo dosis máxima tolerada de IECA o ARA-II
cie11: GB61
estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

# ── Decisión Rápida en Punto de Atención ────────────────────────────────────
decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Nefroprotección no esteroidea: añadir a dosis máxima tolerada de IECA/ARA-II si potasio ≤ 4.8 mEq/L
    y TFGe ≥ 25 mL/min/1.73 m²; reduce el riesgo de fallo renal terminal (NNT 31 a 2.6 años) y muerte o
    eventos cardiovasculares (NNT 56). Obligatorio control de potasio y TFGe a las 4 semanas.
  alerta_seguridad_inmediata: >-
    No iniciar si potasio sérico > 4.8 mEq/L. Suspender inmediatamente si supera 5.5 mEq/L (NNH 72
    para retirada por hiperpotasemia). Contraindicado de forma absoluta con inhibidores potentes de CYP3A4
    y suplementos o diuréticos ahorradores de potasio.

# ── Pregunta PICO ────────────────────────────────────────────────────────────
pico:
  p: Adultos con diabetes mellitus tipo 2 y enfermedad renal crónica con albuminuria persistente (UACR 30-5000 mg/g) bajo dosis máxima tolerada de IECA o ARA-II y TFGe ≥ 25 mL/min/1.73 m²
  i: Finerenona (10 o 20 mg por vía oral una vez al día) añadida al tratamiento estándar
  c: Placebo añadido al tratamiento estándar óptimo
  o: Fallo renal (enfermedad renal terminal, caída sostenida del TFGe a <15 o descenso ≥40%, muerte renal), eventos cardiovasculares mayores, hiperpotasemia

# ── Posología Práctica ───────────────────────────────────────────────────────
posologia:
  inicio: >-
    10 mg una vez al día si TFGe entre 25 y 59 mL/min/1.73 m²; 20 mg una vez al día si TFGe ≥ 60 mL/min/1.73 m².
    Solo iniciar si potasio sérico es ≤ 4.8 mEq/L.
  escalado: >-
    Titular de 10 mg a 20 mg una vez al día tras 4 semanas si el potasio sérico se mantiene ≤ 4.8 mEq/L
    y el filtrado glomerular permanece estable.
  mantenimiento: 20 mg por vía oral una vez al día (o 10 mg/día si el potasio se sitúa entre 4.9 y 5.5 mEq/L)
  maxima: 20 mg una vez al día
  ajuste_renal: >-
    No iniciar si TFGe < 25 mL/min/1.73 m². Si el paciente progresa durante el tratamiento a TFGe < 15 mL/min/1.73 m²
    o entra en diálisis, suspender definitivamente el fármaco.
  ref: 'fda:label'

# ── Evidencia Clínica Cuantitativa (Eficacia & NNT) ──────────────────────────
evidencia:
