    criticidad: importante
    efecto: 'Baja incidencia en comparación con formulaciones típicas clásicas (acatisia en 4 % con paliperidona vs 1 % con placebo)'
    rra: '3.0%'
    rrr: '75.0%'
    nnt: 34
    horizonte_nnt: a 1 año
    diseno: eca
