id: 'FT:0018'
tipo: ficha
farmaco: 'FS:0017'
seleccion: 'SEL:0010'
titulo: Palmitato de paliperidona en la prevención de recaídas en la esquizofrenia
indicacion: Prevención de recaídas y mantenimiento en personas adultas con esquizofrenia
indicacion_en: Relapse prevention and maintenance in adults with schizophrenia
poblacion: Adultos con esquizofrenia estabilizados tras un episodio o con dificultades de adherencia terapéutica oral
cie11: 6A20
estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Antipsicótico inyectable de acción prolongada mensual (LAI): régimen de carga obligatorio en deltoides
    (150 mg eq día 1 y 100 mg eq día 8) sin necesidad de suplementación oral; mantenimiento flexible (75 mg eq/mes, rango 25-150 mg eq).
    Reduce de forma contundente la tasa de recaída a un tercio frente a placebo (10 % vs 34 %; NNT 5 a 1 año; HR 3.60).
  alerta_seguridad_inmediata: >-
    Confirmar tolerancia oral previa a risperidona o paliperidona antes de la primera inyección.
    Contraindicado el uso inyectable depot si eGFR < 50 mL/min. Vigilar signos precoces de acatisia y síndrome metabólico.

pico:
  p: Adultos con esquizofrenia clínicamente estabilizados tras fase abierta de ajuste posológico
  i: Palmitato de paliperidona intramuscular mensual (dosis estabilizada entre 25 y 100 mg eq)
  c: Placebo intramuscular mensual
  o: Tiempo transcurrido hasta la primera recaída psicótica, tasa de recaídas acumuladas y eventos adversos

posologia:
  inicio: >-
    Día 1: 150 mg eq (234 mg de palmitato) en músculo deltoides. Día 8: 100 mg eq (156 mg de palmitato) en músculo deltoides.
  escalado: >-
    La pauta de carga en deltoides es obligatoria para alcanzar concentraciones terapéuticas rápidas sin suplemento oral.
  mantenimiento: >-
    75 mg eq (117 mg de palmitato) una vez al mes por vía intramuscular (en deltoides o glúteo), con rango terapéutico de 25 a 150 mg eq según respuesta clínica.
  maxima: 150 mg eq al mes
  ajuste_renal: >-
    En insuficiencia renal leve (TFGe 50 a 79 mL/min): carga de 100 mg eq día 1 y 75 mg eq día 8 (ambas en deltoides); mantenimiento mensual de 50 mg eq.
    No recomendado si TFGe < 50 mL/min.
  ref: 'fda:label'

