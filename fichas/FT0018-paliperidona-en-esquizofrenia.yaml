balance:
  efectos_deseables: grande
  efectos_indeseables: moderado
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda el uso de palmitato de paliperidona inyectable mensual en pacientes adultos con esquizofrenia
    que presentan dificultades de cumplimiento con la vía oral o prefieren un régimen de administración prolongada,
    iniciando con pauta de carga deltoidea (150 mg eq día 1 y 100 mg eq día 8) y monitorización metabólica periódica.
  ref: 'pmid:19959339'

conclusion: >-
  El palmitato de paliperidona previene eficazmente las recaídas sintomáticas en la esquizofrenia (NNT 5 a 1 año, HR 3.60),
  ofreciendo un perfil neurológico favorable frente a los inyectables de primera generación a costa de vigilancia metabólica y ponderal.

