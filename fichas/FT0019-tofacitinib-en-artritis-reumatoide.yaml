id: 'FT:0019'
tipo: ficha
farmaco: 'FS:0018'
seleccion: 'SEL:0002'
titulo: Tofacitinib en la artritis reumatoide activa tras respuesta inadecuada a metotrexato
indicacion: Artritis reumatoide activa de moderada a grave con respuesta insuficiente o intolerancia a metotrexato
indicacion_en: Moderate-to-severe active rheumatoid arthritis with inadequate response to methotrexate
poblacion: Adultos con artritis reumatoide moderada a grave refractarios o intolerantes a metotrexato
cie11: FA20
estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: amarillo
  fuerza: condicional
  perla_prescripcion: >-
    Inhibidor oral de JAK (5 mg dos veces al día en combinación con MTX o monoterapia): logra respuesta ACR 20
    en el 51.5 % a los 6 meses (NNT 5 vs placebo), eficacia comparable a adalimumab pero por vía oral.
    Semáforo AMARILLO por alertas del estudio ORAL Surveillance: riesgo incrementado de MACE, neoplasias e infecciones graves
    (herpes zóster NNH 33) en pacientes ≥ 50 años con factores de riesgo cardiovascular o tabaquismo.
  alerta_seguridad_inmediata: >-
    Cribado obligatorio de tuberculosis latente y hepatitis virales antes del inicio.
    Evitar su uso en pacientes ≥ 50 años con alto riesgo cardiovascular o fumadores crónicos salvo ausencia de alternativa adecuada. Vacunar previamente frente a herpes zóster.

pico:
  p: Adultos con artritis reumatoide activa a pesar de dosis estables de metotrexato (N=717)
  i: Tofacitinib 5 mg por vía oral dos veces al día en adición a metotrexato
  c: Placebo oral (con opción de rescate a los 3 meses) o adalimumab 40 mg SC cada 2 semanas
  o: Respuesta ACR 20 a los 6 meses, mejoría funcional (HAQ-DI) e infecciones adversas

posologia:
  inicio: 5 mg por vía oral dos veces al día (o formulación retard de 11 mg una vez al día)
  escalado: Dosis fija; no requiere escalado
  mantenimiento: 5 mg dos veces al día
  maxima: 5 mg dos veces al día (la dosis de 10 mg bid está restringida por mayor riesgo trombótico y de MACE)
  ajuste_renal: >-
    Reducir a 5 mg una vez al día en insuficiencia renal moderada o grave (TFGe < 50 mL/min).
  ajuste_hepatico: >-
    Reducir a 5 mg una vez al día en insuficiencia hepática moderada (Child-Pugh B); contraindicado en Child-Pugh C.
  ref: 'fda:label'

evidencia:
