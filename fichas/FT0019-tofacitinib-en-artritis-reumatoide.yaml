    criticidad: critico
    efecto: 'Tasa de respuesta del 51.5 % con tofacitinib 5 mg bid frente a 28.3 % con placebo (p < 0.001); y 47.2 % con adalimumab en ORAL Standard'
    rra: '23.2%'
    rrr: '45.0%'
    nnt: 5
    horizonte_nnt: a 6 meses
    diseno: eca
    estudio: ORAL Standard (2012)
    comparador: Placebo oral sobre fondo de MTX
    n: 717
    certeza: alta
    razones_descenso: []
    ref: 'pmid:22873531'

  - desenlace: Eventos cardiovasculares adversos mayores (MACE) a 4 años
    criticidad: critico
    efecto: 'Incidencia de MACE del 3.4 % con tofacitinib combinado frente a 2.5 % con inhibidores de TNF (HR 1.33, IC 95 % 0.91–1.94, no demostró no-inferioridad en ORAL Surveillance)'
    rra: '0.9%'
    rrr: '26.5%'
    nnt: 112
    horizonte_nnt: a 4 años
    diseno: eca
    estudio: ORAL Surveillance (2022)
    comparador: Inhibidor de TNF (adalimumab / etanercept)
    n: 4362
    certeza: alta
    razones_descenso: []
    ref: 'pmid:35081280'

  - desenlace: Infección por herpes zóster a 4 años
    criticidad: importante
    efecto: 'Incidencia significativamente mayor con tofacitinib que con anti-TNF (incidencia acumulada ~3.0 % de exceso)'
    rra: '3.0%'
    rrr: '60.0%'
    nnt: 34
    horizonte_nnt: a 4 años
    diseno: eca
    estudio: ORAL Surveillance (2022)
    comparador: Inhibidor de TNF
    n: 4362
    certeza: alta
    razones_descenso: []
    ref: 'pmid:35081280'

balance:
  efectos_deseables: moderado
  efectos_indeseables: moderado
  certeza_global: alta
  valores_preferencias: hay_incertidumbre_o_variabilidad_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: condicional
  enunciado: >-
    Se sugiere el uso de tofacitinib (5 mg dos veces al día) como alternativa oral en pacientes con artritis reumatoide activa
    que no han alcanzado el objetivo terapéutico con metotrexato, condicionando su prescripción a la exclusión previa de alto riesgo cardiovascular o neoplasias según los hallazgos de ORAL Surveillance.
  ref: 'pmid:35081280'

conclusion: >-
  Tofacitinib ofrece una alternativa oral de alta eficacia en artritis reumatoide refractaria a metotrexato (NNT 5 en ACR20),
  pero su perfil de seguridad exige ponderar el riesgo cardiovascular (MACE) y el incremento notable de herpes zóster (NNH 34).

guias:
  - organizacion: EULAR / ACR
    anio: 2022
    titulo: 'EULAR recommendations for the management of rheumatoid arthritis / ACR Guideline'
    posicion: 'Los inhibidores de JAK pueden considerarse tras fallo de csDMARD, pero deben prescribirse con cautela en pacientes con factores de riesgo cardiovascular o tromboembólico.'
    cita: 'EULAR RA Recommendations'

