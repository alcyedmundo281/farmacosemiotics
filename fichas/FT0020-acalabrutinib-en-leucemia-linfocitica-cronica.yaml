balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda acalabrutinib (100 mg cada 12 horas) como inhibidor de BTK preferente en adultos con leucemia linfocítica crónica
    previamente tratada o con deleción 17p/11q, por demostrar eficacia antitumoral equivalente a ibrutinib con un perfil de cardiotoxicidad y arritmias significativamente inferior.
  ref: 'pmid:34310172'

conclusion: >-
  Acalabrutinib confirma la no-inferioridad en control de la leucemia linfocítica crónica frente a ibrutinib aportando un beneficio cardiológico incuestionable (NNT de daño arrítmico evitado 16).

guias:
  - organizacion: NCCN / ESMO
    anio: 2023
    titulo: 'Clinical Practice Guidelines in Oncology: Chronic Lymphocytic Leukemia'
    posicion: 'Acalabrutinib es un inhibidor de BTK de categoría preferente (Categoría 1) tanto en primera línea como en enfermedad en recaída o refractaria, destacando su perfil de seguridad cardiovascular superior frente a ibrutinib.'
    cita: 'NCCN Guidelines CLL/SLL'

