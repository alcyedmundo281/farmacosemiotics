id: 'FT:0020'
tipo: ficha
farmaco: 'FS:0019'
seleccion: 'SEL:0011'
titulo: Acalabrutinib en la leucemia linfocítica crónica en recaída o refractaria
indicacion: Leucemia linfocítica crónica o linfoma linfocítico pequeño en pacientes previamente tratados
indicacion_en: Relapsed or refractory chronic lymphocytic leukemia
poblacion: Adultos con LLC en recaída o refractaria, incluyendo pacientes con alteraciones citogenéticas de alto riesgo del(17p) o del(11q)
cie11: 2A70.0
estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Inhibidor de BTK de segunda generación con alta selectividad enzimática: 100 mg por vía oral dos veces al día de forma continua.
    Demuestra no-inferioridad en supervivencia libre de progresión frente a ibrutinib (mediana 38.4 meses en ambos grupos; HR 1.00)
    con una reducción del 41 % en la tasa de fibrilación/flutter auricular (9.4 % vs 16.0 %; NNT de daño evitado 16 a 41 meses)
    y menor incidencia de hipertensión y sangrado.
  alerta_seguridad_inmediata: >-
    Contraindicado el uso concomitante con inhibidores de la bomba de protones (IBP) por disminución crítica de absorción.
    Suspender al menos 3 días antes de cirugía menor y 7 días antes de cirugía mayor por riesgo hemorrágico.

pico:
  p: Adultos con LLC previamente tratada con del(17p) o del(11q) confirmada (N=533)
  i: Acalabrutinib 100 mg por vía oral dos veces al día en monoterapia continua
  c: Ibrutinib 420 mg por vía oral una vez al día en monoterapia continua
  o: Supervivencia libre de progresión (SLP), incidencia de fibrilación auricular y eventos adversos cardiovasculares

posologia:
  inicio: 100 mg por vía oral dos veces al día (cada 12 horas aproximadamente, con o sin comida)
  escalado: Dosis plena desde el inicio sin escalado
  mantenimiento: 100 mg dos veces al día hasta progresión de la enfermedad o toxicidad inaceptable
  maxima: 100 mg dos veces al día
  ajuste_renal: No requiere ajuste en insuficiencia renal leve o moderada; precaución en TFGe < 30 mL/min.
  ajuste_hepatico: >-
    No requiere ajuste en insuficiencia hepática leve o moderada (Child-Pugh A o B); no recomendado en insuficiencia hepática grave (Child-Pugh C).
  ref: 'fda:label'

