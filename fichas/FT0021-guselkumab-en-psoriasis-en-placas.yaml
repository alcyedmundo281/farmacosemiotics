id: 'FT:0021'
tipo: ficha
farmaco: 'FS:0004'
seleccion: 'SEL:0003'
titulo: Guselkumab en la psoriasis en placas moderada a grave
indicacion: Psoriasis en placas moderada a grave en adultos candidatos a terapia sistémica
indicacion_en: Moderate-to-severe plaque psoriasis in adults
poblacion: Adultos con psoriasis en placas moderada a grave candidatos a tratamiento sistémico o fototerapia
cie11: EA90
estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Inhibidor selectivo de la subunidad p19 de la IL-23: 100 mg subcutáneo en semanas 0, 4 y luego cada 8 semanas.
    Logra tasas muy elevadas de respuesta PASI 90 a la semana 16 superiores tanto a placebo (73.3 % vs 2.9 %; NNT 2)
    como a adalimumab (73.3 % vs 49.7 %; NNT 5), manteniendo el blanqueamiento cutáneo hasta la semana 48 con excelente tolerabilidad.
  alerta_seguridad_inmediata: >-
    Descartar tuberculosis activa o latente antes de iniciar. No requiere analíticas rutinarias frecuentes
    más allá de la vigilancia clínica estándar en pacientes seleccionados.

pico:
  p: Adultos con psoriasis en placas de moderada a grave candidatos a tratamiento biológico (N=837)
  i: Guselkumab 100 mg por vía subcutánea en las semanas 0, 4 y posteriormente cada 8 semanas
  c: Placebo subcutáneo (con cruce a guselkumab en semana 16) o adalimumab activo
  o: Aclaramiento cutáneo PASI 90 a semana 16, respuesta IGA 0/1 y seguridad a 48 semanas

posologia:
  inicio: 100 mg mediante inyección subcutánea en la semana 0 y en la semana 4
  escalado: Tras la dosis de semana 4 pasa directamente a la pauta bimestral
  mantenimiento: 100 mg por vía subcutánea cada 8 semanas
  maxima: 100 mg cada 8 semanas
  ajuste_renal: No requiere ajuste en insuficiencia renal o hepática
  ref: 'fda:label'

evidencia:
