    efecto: 'Reducción del 32 % en el riesgo de progresión de discapacidad confirmada a 6 meses (8.1 % vs 12.0 %; HR 0.68, IC 95 % 0.50–0.92; p = 0.01)'
    rra: '3.9%'
    rrr: '32.5%'
    nnt: 26
