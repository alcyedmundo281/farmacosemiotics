  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Anticuerpo anti-CD20 totalmente humano autoadministrable por vía subcutánea: pauta de carga de 20 mg en semanas 0, 1 y 2,
    seguida de mantenimiento mensual de 20 mg SC en domicilio. Reduce a la mitad la tasa anualizada de brotes frente a teriflunomida
    (ARR 0.11 vs 0.22; p < 0.001; NNT 9 anual) y retrasa el avance de la discapacidad a 6 meses (NNT 26 a 2.5 años).
  alerta_seguridad_inmediata: >-
    Descartar infección activa o latente por virus de la hepatitis B (HBsAg y anti-HBc) antes de iniciar.
    Completar esquema de vacunación antes de la primera dosis; no administrar vacunas de virus vivos durante el tratamiento.

pico:
  p: Adultos con esclerosis múltiple remitente-recurrente activa (N=1882)
  i: Ofatumumab 20 mg por vía subcutánea mensual (tras dosis de carga)
  c: Teriflunomida 14 mg por vía oral una vez al día
  o: Tasa anualizada de brotes (ARR), empeoramiento de discapacidad confirmado a 3 y 6 meses, y lesiones activas en RM

posologia:
  inicio: 20 mg mediante inyección subcutánea en las semanas 0 (día 1), 1 (día 7) y 2 (día 14)
  escalado: Descanso en la semana 3; primera dosis mensual regular a partir de la semana 4
  mantenimiento: 20 mg por vía subcutánea una vez al mes mediante autoinyector Sensoready
  maxima: 20 mg al mes
  ajuste_renal: No requiere ajuste en insuficiencia renal o hepática
  ref: 'fda:label'

