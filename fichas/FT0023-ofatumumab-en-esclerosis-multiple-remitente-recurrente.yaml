balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda ofatumumab subcutáneo mensual (20 mg SC) en pacientes adultos con esclerosis múltiple remitente-recurrente activa,
    dada su superioridad contundente frente a comparadores orales clásicos en reducción de brotes (NNT 9 anual) y prevención del avance de la discapacidad,
    con la ventaja de autoadministración domiciliaria sin requerir infusiones hospitalarias.
  ref: 'pmid:32757523'

conclusion: >-
  Ofatumumab redefine el tratamiento de alta eficacia en la esclerosis múltiple al combinar la potencia de depleción de células B de los anti-CD20
  con la conveniencia y autonomía de la vía subcutánea mensual en el hogar.

