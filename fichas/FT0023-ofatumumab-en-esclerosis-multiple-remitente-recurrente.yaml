id: 'FT:0023'
tipo: ficha
farmaco: 'FS:0021'
seleccion: 'SEL:0013'
titulo: Ofatumumab en la esclerosis múltiple remitente-recurrente activa
indicacion: Tratamiento de pacientes adultos con formas recurrentes de esclerosis múltiple con enfermedad activa
indicacion_en: Treatment of adults with relapsing forms of multiple sclerosis with active disease
poblacion: Adultos con diagnóstico confirmado de esclerosis múltiple remitente-recurrente con brotes recientes o lesiones activas en RM
cie11: 8A40.0
estado: revisado
fecha: '2026-09-16'
actualizado: '2026-09-16'
