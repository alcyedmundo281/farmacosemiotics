balance:
  efectos_deseables: grande
  efectos_indeseables: moderado
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda fuertemente blinatumomab en infusión continua (28 días por ciclo) en adultos con LLA B en recaída o refractaria,
    por duplicar las tasas de remisión completa (NNT 5 a 12 semanas) y prolongar significativamente la supervivencia global (NNT 9 a 1 año),
    actuando como el puente inmunológico preferente hacia el trasplante alogénico curativo.
  ref: 'pmid:28249141'

conclusion: >-
  Blinatumomab marca un cambio de paradigma frente a la quimioterapia tradicional en la LLA de células B refractaria,
  ofreciendo una remisión hematológica profunda y duradera con toxicidad celular manejable bajo monitorización especializada.

guias:
