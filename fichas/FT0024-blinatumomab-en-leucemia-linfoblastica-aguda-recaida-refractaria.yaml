    anio: 2023
    titulo: 'NCCN Clinical Practice Guidelines in Oncology: Acute Lymphoblastic Leukemia'
    posicion: 'Blinatumomab es régimen preferente de Categoría 1 para pacientes con LLA B CD19+ en recaída o refractarios o con enfermedad mínima residual (EMR) persistente.'
    cita: 'NCCN ALL Guidelines'

