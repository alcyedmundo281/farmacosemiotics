  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Anticuerpo biespecífico BiTE CD19/CD3 administrado en infusión intravenosa continua de 28 días por ciclo:
    escalado obligatorio en Ciclo 1 (9 mcg/día días 1-7, luego 28 mcg/día días 8-28) con 2 semanas de descanso interciclos.
    Casi duplica la tasa de remisión completa frente a quimioterapia intensiva (44 % vs 25 %; NNT 5 a 12 semanas)
    y prolonga la supervivencia global (7.7 vs 4.0 meses; HR 0.71; NNT 9 a 1 año) sirviendo de puente a trasplante curativo.
  alerta_seguridad_inmediata: >-
    Hospitalización obligatoria para monitorización durante los primeros 9 días del ciclo 1 y primeros 2 días del ciclo 2.
    Premedicación con dexametasona y vigilancia estrecha de síndrome de liberación de citoquinas (SLC) y neurotoxicidad (ICANS).

pico:
  p: Adultos con LLA B en recaída o refractaria politratados (N=405)
  i: Blinatumomab en infusión IV continua durante 4 semanas (9 mcg/d escalando a 28 mcg/d)
  c: Quimioterapia estándar de rescate (FLAG-Ida u otros esquemas)
  o: Supervivencia global (SG), tasa de remisión completa (RC/RCh) y eventos adversos graves

posologia:
  inicio: 'Ciclo 1: 9 mcg/día en infusión intravenosa continua (IVC) durante los días 1 a 7, escalando a 28 mcg/día en IVC continua desde el día 8 hasta el día 28'
  escalado: El escalado escalonado es indispensable para prevenir el síndrome de liberación de citoquinas fulminante
  mantenimiento: 'Ciclos posteriores: 28 mcg/día en infusión IV continua durante 28 días, seguidos de 14 días de descanso (ciclo de 42 días)'
  maxima: 28 mcg al día en infusión continua
  ajuste_renal: No requiere ajuste específico; monitorizar en insuficiencia renal grave
  ref: 'fda:label'

