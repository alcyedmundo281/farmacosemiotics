seleccion: 'SEL:0014'
titulo: Blinatumomab en la leucemia linfoblástica aguda de precursores B en recaída o refractaria
indicacion: Leucemia linfoblástica aguda de precursores de células B con CD19 positivo en recaída o refractaria en adultos
indicacion_en: Relapsed or refractory CD19-positive B-cell precursor acute lymphoblastic leukemia in adults
poblacion: Adultos con LLA B en recaída o refractaria a quimioterapia previa, candidatos a inmunoterapia dirigida o rescate hacia trasplante
cie11: 2A60.0
estado: revisado
fecha: '2026-09-16'
actualizado: '2026-09-16'
