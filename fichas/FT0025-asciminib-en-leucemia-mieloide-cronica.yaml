balance:
  efectos_deseables: grande
  efectos_indeseables: pequeno
  certeza_global: alta
  valores_preferencias: no_hay_incertidumbre_importante
  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda asciminib oral (40 mg cada 12 horas en ayunas) en pacientes adultos con leucemia mieloide crónica en fase crónica
    previamente tratados con dos o más inhibidores de tirosina quinasa, por su superioridad en respuesta molecular mayor (NNT 8 a 24 semanas)
    y su perfil de seguridad notablemente superior con menor tasa de discontinuación por toxicidad frente a bosutinib.
  ref: 'pmid:34407542'

conclusion: >-
  Asciminib ofrece una solución terapéutica alostérica de alta especificidad para pacientes con LMC multirresistente,
  superando la resistencia cruzada de los inhibidores tradicionales del sitio del ATP con una tolerabilidad clínica sin precedentes (NNT de toxicidad evitada 7).

