id: 'FT:0025'
tipo: ficha
farmaco: 'FS:0023'
seleccion: 'SEL:0015'
titulo: Asciminib en la leucemia mieloide crónica resistente a dos o más inhibidores de tirosina quinasa
indicacion: Leucemia mieloide crónica con cromosoma Filadelfia en fase crónica en pacientes tratados previamente con dos o más TKI
indicacion_en: Philadelphia chromosome-positive chronic myeloid leukemia in chronic phase treated with two or more TKIs
poblacion: Adultos con LMC en fase crónica resistentes o intolerantes a ≥ 2 inhibidores de tirosina quinasa previos
cie11: 2A71.0
estado: revisado
fecha: '2026-09-16'
actualizado: '2026-09-16'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

decision_clinica:
  semaforo: verde
  perla_prescripcion: >-
    Inhibidor alostérico STAMP del bolsillo de miristoilo de BCR::ABL1: 40 mg por vía oral cada 12 horas en ayunas riguroso.
    Casi duplica la tasa de respuesta molecular mayor a la semana 24 frente a bosutinib (25.5 % vs 13.2 %; p = 0.029; RRA 12.3 %, NNT 8 a 24 semanas)
    y reduce drásticamente las interrupciones por toxicidad a un tercio (5.8 % vs 21.1 %; NNT de toxicidad evitada 7).
  alerta_seguridad_inmediata: >-
    Toma oral obligatoria con el estómago vacío (al menos 2 horas antes y 1 hora después de cualquier ingesta calórica).
    Monitorizar amilasa y lipasa pancreáticas; suspender si lipasa > 2 veces el LSN o sospecha de pancreatitis aguda.

pico:
  p: Adultos con LMC en fase crónica multitratados con fracaso a ≥ 2 TKIs previos (N=233)
  i: Asciminib 40 mg por vía oral dos veces al día en ayunas
  c: Bosutinib 500 mg por vía oral una vez al día con alimentos
  o: Respuesta molecular mayor (RMM, BCR::ABL1 ≤ 0.1 %) a la semana 24, seguridad y abandonos por efectos adversos

posologia:
  inicio: 40 mg por vía oral dos veces al día (cada 12 horas aproximadamente) en ayunas estricto (o 80 mg una vez al día)
  escalado: Dosis plena de inicio; en caso de mutación T315I se titula a 200 mg dos veces al día
  mantenimiento: 40 mg dos veces al día de forma continuada hasta pérdida de respuesta o toxicidad
  maxima: 80 mg al día en LMC sin mutación T315I (400 mg/día en portadores de T315I)
  ajuste_renal: No requiere ajuste en insuficiencia renal leve o moderada
  ajuste_hepatico: No requiere ajuste en insuficiencia hepática leve, moderada o grave
  ref: 'fda:label'

