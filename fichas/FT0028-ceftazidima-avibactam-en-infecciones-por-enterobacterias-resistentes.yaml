  equidad: probablemente_aumenta
  aceptabilidad: si
  factibilidad: si

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda ceftazidima / avibactam intravenoso (2.5 g en infusión de 2 h cada 8 horas con ajuste renal)
    como tratamiento dirigido de primera elección en pacientes adultos con infecciones complicadas (intraabdominales o urinarias)
    causadas por enterobacterias productoras de carbapenemasas KPC o OXA-48, por su eficacia equivalente a los esquemas de referencia
    y su perfil de seguridad exento de la nefrotoxicidad de las polimixinas.
  ref: 'pmid:27107460'

conclusion: >-
  Ceftazidima / avibactam constituye un pilar esencial del grupo de Reserva de la OMS para combatir patógenos multirresistentes:
  restaura la eficacia del beta-lactámico inhibiendo las carbapenemasas de clase A y D y rescata a pacientes con sepsis grave
  sin incurrir en el daño tubular agudo propio de colistina o aminoglucósidos.

