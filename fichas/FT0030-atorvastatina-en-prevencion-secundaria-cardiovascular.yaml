  equidad: aumenta
  aceptabilidad: si
  factibilidad: si
recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: Se recomienda atorvastatina oral a dosis alta (80 mg/día) en pacientes
    adultos con enfermedad cardiovascular aterosclerótica establecida de muy alto
    riesgo, por su beneficio superior en prevención de eventos cardiovasculares mayores
    recurrentes (NNT 45 a 4.9 años) y perfil de seguridad hepatomuscular favorable.
  ref: pmid:15755765
conclusion: La pauta intensiva con atorvastatina 80 mg/día consolida la máxima evidencia
  de protección endotelial y reducción del c-LDL en prevención secundaria, con una
  relación beneficio-riesgo plenamente favorable frente a dosis bajas.
guias:
- organizacion: ESC / EAS
  anio: 2019
  titulo: 'ESC/EAS Guidelines for the management of dyslipidaemias: lipid modification
    to reduce cardiovascular risk'
  posicion: Se recomienda tratamiento con estatina de alta intensidad hasta la dosis
    máxima tolerada para alcanzar una reducción ≥ 50 % en c-LDL y un objetivo < 55
    mg/dL en muy alto riesgo.
  cita: Eur Heart J 2020
