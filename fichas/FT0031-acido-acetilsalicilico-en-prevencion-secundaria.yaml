  titulo: ESC Guidelines on cardiovascular disease prevention in clinical practice
  posicion: Se recomienda ácido acetilsalicílico (75-100 mg/día) en todos los pacientes
    con enfermedad cardiovascular aterosclerótica documentada.
  cita: Eur Heart J 2021
