recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: Se recomienda ácido acetilsalicílico a dosis bajas (75 a 100 mg/día)
    de forma continuada en pacientes adultos con enfermedad cardiovascular oclusiva
    establecida, por su prevención demostrada de infarto, ictus y muerte vascular
    (NNT 67 anual) frente a un incremento muy reducido de sangrado mayor (NNH 770
    anual).
  ref: pmid:19482214
conclusion: 'El ácido acetilsalicílico a dosis bajas es el estándar universal de oro
  en antiagregación para prevención secundaria: previene alrededor de 15 eventos vasculares
  mayores por cada 1000 pacientes tratados al año a cambio de apenas 1 evento hemorrágico
  extracraneal añadido.'
