  titulo: Consensus on the management of pemphigus vulgaris and foliaceus
  posicion: Micofenolato de mofetilo se recomienda como inmunosupresor adyuvante de
    segunda línea junto a corticosteroides.
  cita: J Eur Acad Dermatol Venereol 2020
