recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: Se recomienda faricimab intravítreo (6.0 mg) en régimen extendido (hasta
    cada 16 semanas) en adultos con degeneración macular asociada a la edad neovascular
    activa, por su eficacia funcional y anatómica no inferior a aflibercept bimestral
    (NNT 1 para no-inferioridad visual) con una reducción a la mitad en la frecuencia
    de inyecciones intraoculares requeridas.
  ref: pmid:35085502
conclusion: 'Faricimab representa un avance cualitativo en la farmacoterapia retiniana
  mediante la inhibición biespecífica de Ang-2 y VEGF-A: preserva la visión de los
  pacientes al tiempo que reduce a la mitad la carga asistencial de inyecciones para
  el paciente y el sistema sanitario.'
guias:
- organizacion: EURETINA / AAO
