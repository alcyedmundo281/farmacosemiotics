  - desenlace: >-
      Desenlace primario (cardiopatía isquémica mortal o infarto no mortal), con
      clortalidona frente a amlodipino y a lisinopril
    criticidad: critico
    diseno: eca
    estudio: ALLHAT, 33 357 asignados, seguimiento medio 4,9 años
    comparador: amlodipino o lisinopril
    n: 33357
    efecto: >-
      sin diferencia: tasa a seis años 11,5 % con clortalidona; RR 0,98
      (IC95 % 0,90–1,07) para amlodipino y 0,99 (IC95 % 0,91–1,08) para lisinopril
    certeza: alta
    ref: 'pmid:12479763'
    nota: >-
      ALLHAT usó CLORTALIDONA, no hidroclorotiazida. Que este ensayo pueda leerse
      sobre esta ficha depende de que la Lista Modelo declare la clortalidona
      alternativa terapéutica de la hidroclorotiazida; no de que sean el mismo
      fármaco. No lo son: difieren en potencia y en semivida.

  - desenlace: >-
      Insuficiencia cardiaca a seis años, con clortalidona frente a amlodipino
    criticidad: critico
    diseno: eca
    estudio: ALLHAT
    comparador: amlodipino
    n: 24303
    efecto: >-
      7,7 % con clortalidona frente a 10,2 % con amlodipino; RR 1,38
      (IC95 % 1,25–1,52) para amlodipino
    certeza: alta
    ref: 'pmid:12479763'

balance:
  efectos_deseables: moderado
  efectos_indeseables: pequeno
  certeza_global: moderada
  valores_preferencias: >-
    Las diferencias absolutas entre clases son de uno a tres puntos porcentuales
    a varios años. Un paciente que ya tolera bien otra clase no gana nada
    cambiándose; uno que empieza de cero y paga de su bolsillo sí.
  equidad: >-
    Muy favorable. Genérico antiguo, oral, de una toma diaria y entre los
    antihipertensivos más baratos que existen.
  aceptabilidad: alta
  factibilidad: >-
    Alta, con una condición que no es trivial donde escasea el laboratorio: exige
    controlar sodio, potasio y función renal al inicio y en el seguimiento.

recomendacion:
  direccion: a_favor
  fuerza: fuerte
  enunciado: >-
    Se recomienda un diurético tiazídico o similar como primer fármaco en el
    adulto con hipertensión arterial esencial sin una indicación imperiosa de
    otra clase, vigilando el sodio y el potasio.
  enunciado_en: >-
    A thiazide or thiazide-like diuretic is recommended as first-line therapy in
    adults with essential hypertension without a compelling indication for
    another class, with monitoring of sodium and potassium.
  ref: 'pmid:37439548'
  nota_clase: >-
    La conclusión de la revisión no es que la tiazida gane por mucho, sino que
    «ninguna clase de antihipertensivo demostró ventaja clínicamente importante
    sobre las tiazidas de primera línea». La recomendación es fuerte por eso y
    por el coste, no por un efecto grande.

alternativas:
  - dci: Clortalidona
    lme: true
    lme_seccion: '12.3'
    nota: >-
      Alternativa terapéutica en la Lista Modelo, y el fármaco realmente usado en
      ALLHAT. Más potente y de semivida más larga que la hidroclorotiazida.
  - dci: Indapamida
    lme: true
    lme_seccion: '12.3'
    nota: Alternativa terapéutica listada; entra además en la triple combinación con perindopril y amlodipino.
  - dci: Amlodipino
    atc: C08CA01
    lme: true
    lme_seccion: '12.3'
    nota: >-
      Ficha propia en FT:0008. Menos insuficiencia cardiaca con la tiazida, sin
      diferencia en mortalidad.
  - dci: Enalapril
    atc: C09AA02
    lme: true
    lme_seccion: '12.3'
    nota: Ficha propia en FT:0037. Menos ictus con la tiazida, sin diferencia en mortalidad.

conclusion: >-
  En comparaciones directas de más de 90 000 personas, ninguna otra clase superó
  a las tiazidas como primer fármaco: la mortalidad total fue indistinguible
  frente a betabloqueantes, antagonistas del calcio e IECA, y las tiazidas
  redujeron algo los eventos cardiovasculares, la insuficiencia cardiaca frente a
  los antagonistas del calcio, el ictus frente a los IECA y los abandonos por
  efectos adversos. Las diferencias absolutas son pequeñas. Lo que inclina la
  recomendación no es la magnitud del efecto sino que, a igualdad de resultados,
  este es el fármaco más barato y disponible. La salvedad honesta: el ensayo que
  más pesa usó clortalidona, y la lectura sobre hidroclorotiazida se apoya en que
  la propia Lista Modelo las declara intercambiables.

