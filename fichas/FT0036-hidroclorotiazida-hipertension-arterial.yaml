# Ficha: fármaco × indicación.
#
# Todas las cifras se transcriben del resumen que PubMed publica. Las de
# pmid:37439548 leen SIEMPRE con la tiazida como intervención y la otra clase
# como comparador: es la dirección de la revisión, y darle la vuelta para que
# «quede mejor» sería reescribir el resultado.

id: 'FT:0036'
tipo: ficha
farmaco: 'FS:0034'

titulo: Hidroclorotiazida en la hipertensión arterial del adulto
titulo_en: Hydrochlorothiazide in adult arterial hypertension
indicacion: Hipertensión arterial esencial
indicacion_en: Essential hypertension
poblacion: >-
  Adultos de 50 a 75 años con hipertensión arterial y comorbilidad frecuente,
  incluida diabetes tipo 2, que inician tratamiento farmacológico.
poblacion_en: >-
  Older adults (50 to 75) with hypertension and multiple co-morbidities,
  including type 2 diabetes, starting antihypertensive treatment.
cie11: BA00

estado: borrador
fecha: '2026-08-24'
actualizado: '2026-09-18'
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

pico:
  p: Adultos con hipertensión arterial esencial que inician tratamiento
  i: Diurético tiazídico o similar como primer fármaco
  c: Betabloqueante, antagonista del calcio, IECA o bloqueante alfa como primer fármaco
  o: >-
    Mortalidad total, eventos cardiovasculares totales, ictus, cardiopatía
    isquémica, insuficiencia cardiaca, abandonos por efectos adversos

estrategia:
  - base: PubMed
    consulta: 'first-line[Title] AND hypertension[Title] AND (thiazide OR diuretic)[Title] AND Cochrane Database Syst Rev[Journal]'
    fecha: '2026-08-24'
    nota: >-
      La ficha se ancla en la revisión sistemática de comparaciones directas y en
      el ensayo pivotal que la domina. No es una revisión de novo.

posologia:
  inicio: 12,5 mg al día
  mantenimiento: 12,5 a 25 mg al día en una toma matutina
  maxima: >-
    25 mg al día para la indicación antihipertensiva. Subir de ahí añade daño
    metabólico sin ganancia proporcional de descenso tensional, y es la razón de
    que la Lista Modelo liste 12,5 y 25 mg.
  vigilancia: >-
    Sodio, potasio y función renal antes de iniciar y a las dos a cuatro semanas.
    La hiponatremia del anciano es el desenlace que más veces obliga a suspender.
  ref: 'fda:label'
  url: https://dailymed.nlm.nih.gov/dailymed/drugInfo.cfm?setid=0789baef-3424-43ab-a3fb-4908172da565
  consultado: '2026-08-24'

evidencia:
  - desenlace: Mortalidad total, frente a betabloqueante
    criticidad: critico
    diseno: revision_sistematica
    estudio: Cochrane, 20 ensayos y más de 90 000 asignados en total
    comparador: betabloqueante como primer fármaco
    n: 18241
    efecto: RR 0,96 (IC95 % 0,84–1,10); poca o ninguna diferencia
    certeza: moderada
    certeza_fuente: revision
    certeza_nota: >-
      Certeza asignada por los autores de la revisión, no por esta ficha. El
      resumen publica la calificación sin detallar el motivo del descenso.
    ref: 'pmid:37439548'

  - desenlace: Eventos cardiovasculares totales, frente a betabloqueante
    criticidad: critico
    diseno: revision_sistematica
    comparador: betabloqueante como primer fármaco
    n: 18135
    efecto: >-
      5,4 % frente a 4,8 %; RR 0,88 (IC95 % 0,78–1,00); reducción absoluta del
      riesgo 0,6 %, a favor de la tiazida
    certeza: moderada
    certeza_fuente: revision
    certeza_nota: Certeza de la revisión.
    ref: 'pmid:37439548'

  - desenlace: Abandonos por efectos adversos, frente a betabloqueante
