# PARTE I — Informe de selección del medicamento.
id: 'SEL:0007'
tipo: seleccion
problema: Cáncer de próstata no metastásico resistente a la castración de alto riesgo
problema_en: High-risk nonmetastatic castration-resistant prostate cancer
cie11: 2C82

poblacion: >-
  Varones con cáncer de próstata no metastásico resistente a la castración (CPRCnm) de alto riesgo,
  definido por un tiempo de duplicación del PSA (PSADT) ≤ 10 meses mientras reciben terapia de
  deprivación androgénica (TDA), sin metástasis detectables por imagen convencional.

pregunta: >-
  En varones con CPRCnm y PSADT ≤ 10 meses que mantienen TDA continua, ¿qué antagonista del receptor
  de andrógenos de segunda generación se selecciona para prolongar la supervivencia libre de metástasis
  y la supervivencia global minimizando la toxicidad sobre el sistema nervioso central?

estado: revisado
fecha: '2026-09-11'
actualizado: '2026-09-11'
idioma: es
autores:
  - nombre: Dr. Alcy Edmundo Torres Guerrero
licencia: CC BY-SA 4.0

contexto: >-
  Los tres antiandrógenos de segunda generación (darolutamida, enzalutamida y apalutamida) demostraron
  un beneficio oncológico comparable en supervivencia libre de metástasis (~40 meses vs ~16-18 meses).
  La diferencia crucial radica en la penetración a la barrera hematoencefálica: darolutamida presenta
  una penetración mínima que previene el incremento de fatiga severa, deterioro cognitivo, caídas,
  fracturas y convulsiones característico de los otros agentes.

estrategia:
  - base: PubMed
    consulta: 'darolutamide AND nonmetastatic castration-resistant prostate cancer AND randomized controlled trial'
    fecha: '2026-09-11'
    nota: 'Ensayos pivotales ARAMIS MFS (PMID: 30763142) y ARAMIS OS (PMID: 32905676).'

criterio_decisorio: >-
  Se selecciona el fármaco que maximice la supervivencia libre de metástasis y global preservando la
  calidad de vida y evitando toxicidad sobre el sistema nervioso central en una población asintomática.

conclusion: >-
  Darolutamida queda seleccionada como el antiandrógeno preferente en CPRCnm de alto riesgo: ofrece
  una reducción del 59 % en el riesgo de metástasis o muerte (HR 0.41, NNT 3 a 2 años) y prolonga la
  supervivencia global (HR 0.69, NNT 17 a 3 años) con una tasa de efectos adversos del SNC idéntica al placebo.

candidatos:
  - dci: Darolutamida
    atc: L02BB07
    veredicto: seleccionado
    eficacia:
      juicio: superior
      sustento: >-
        Demostró en ARAMIS prolongar la mediana de supervivencia libre de metástasis a 40.4 meses frente
        a 18.4 meses con placebo (HR 0.41, IC 95 % 0.34-0.50; NNT 3 a 2 años) y redujo la mortalidad global
        en un 31 % (HR 0.69; NNT 17 a 3 años).
      ref: 'pmid:30763142'
    seguridad:
      juicio: superior
      sustento: >-
        Mínima penetración en la barrera hematoencefálica: incidencia de mareos, caídas, deterioro cognitivo
        y convulsiones comparable al placebo (convulsiones 0.2 % vs 0.2 %; caídas 4.2 % vs 4.7 %).
      ref: 'pmid:30763142'
    conveniencia:
      juicio: equivalente
      sustento: >-
        Toma oral de 600 mg cada 12 horas (dos comprimidos de 300 mg) con alimentos.
      ref: 'pmid:30763142'
    costo:
      juicio: inferior
      sustento: >-
        Terapia dirigida de marca bajo patente comercial exclusiva.

  - dci: Terapia de deprivación androgénica aislada (sin antiandrógeno de 2ª generación)
    atc: L02AE02
    veredicto: no_seleccionado
    eficacia:
      juicio: inferior
      sustento: >-
        La mediana de supervivencia libre de metástasis con TDA sola es de apenas 18 meses, con rápida aparición
        de dolor óseo y metástasis viscerales que comprometen la calidad de vida y supervivencia.
      ref: 'pmid:30763142'
    seguridad:
      juicio: equivalente
      sustento: >-
        Comparte los efectos adversos intrínsecos del hipogonadismo farmacológico inducido por la castración.
      ref: 'pmid:30763142'
    conveniencia:
      juicio: superior
      sustento: >-
        Inyección de análogo LHRH trimestral o semestral sin necesidad de toma diaria de comprimidos orales.
      ref: 'pmid:30763142'
    costo:
      juicio: superior
      sustento: >-
        Análogos de LHRH genéricos disponibles a coste moderado en comparación con las nuevas terapias orales.